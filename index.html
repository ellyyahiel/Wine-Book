/* ======================= GÉNÉRATION ======================= */
function genererQuestions() {
  let seed = 20251109;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = (arr, n) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); };
  const uniq = arr => [...new Set(arr)];
  const out = [];
  const add = (theme, q, a, w, x) => { if (w.length >= 1 && !w.includes(a)) out.push({ theme, q, a, w, x }); };
  const voy = c => /^[AEIOUÉÈH]/i.test(c);
  const le = c => (voy(c) ? "L'" : "Le ") + c;
  const du = c => (voy(c) ? "de l'" : "du ") + c;
  const proches = r => { const s = new Set([r]); REGIONS_PROCHES.forEach(p => { if (p.includes(r)) p.forEach(v => s.add(v)); }); return s; };

  // 1. Questions écrites
  Q_ECRITES.forEach(([t, q, a, w, x]) => add(t, q, a, w, x));

  // 2. Appellations → région
  APPELLATIONS.forEach(([ap, reg]) => {
    const ex = proches(reg);
    add("Régions de France", `Dans quelle région viticole se trouve l'appellation ${ap} ?`, reg, pick(REGIONS_FR.filter(r => !ex.has(r)), 3), `${ap} est une appellation de la région ${reg}.`);
  });
  // 3. Appellations → couleur
  APPELLATIONS.forEach(([ap, reg, c]) => {
    if (!c) return;
    const autres = Object.keys(COUL).filter(k => k !== c).map(k => COUL[k]);
    add("Régions de France", `L'appellation ${ap} est surtout connue pour ses vins…`, COUL[c], pick(autres, 3), `${ap} (${reg}) : surtout des vins ${COUL[c]}.`);
  });
  // 4. Appellations → cépage
  const tousCep = uniq(APPELLATIONS.map(a => a[3]).filter(Boolean));
  APPELLATIONS.forEach(([ap, reg, c, cep, autres]) => {
    if (!cep) return;
    const interdits = new Set([cep, ...(autres || [])]);
    APPELLATIONS.filter(a => a[1] === reg && a[3]).forEach(a => interdits.add(a[3]));
    if (GROUPE_SUD.includes(cep)) GROUPE_SUD.forEach(g => interdits.add(g));
    const pool = tousCep.filter(g => !interdits.has(g));
    add("Cépages", `Quel est le cépage emblématique de l'appellation ${ap} ?`, cep, pick(pool, 3), `${ap} (${reg}) est avant tout une terre de ${cep}.`);
  });
  // 5. Intrus et « laquelle se trouve en… »
  const parRegion = {};
  APPELLATIONS.forEach(a => (parRegion[a[1]] = parRegion[a[1]] || []).push(a[0]));
  Object.entries(parRegion).forEach(([reg, aps]) => {
    if (aps.length < 5) return;
    const ex = proches(reg);
    const dehors = APPELLATIONS.filter(a => !ex.has(a[1])).map(a => a[0]);
    const vus = new Set();
    for (let k = 0, essais = 0; k < 7 && essais < 60; essais++) {
      const dedans = pick(aps, 3), intrus = pick(dehors, 1)[0];
      const cle = dedans.slice().sort().join("|") + intrus;
      if (vus.has(cle)) continue; vus.add(cle); k++;
      const regIntrus = APPELLATIONS.find(a => a[0] === intrus)[1];
      add("Régions de France", `Laquelle de ces appellations n'est PAS en ${reg} ?`, intrus, dedans, `${intrus} se trouve en ${regIntrus}. Les trois autres sont en ${reg}.`);
    }
    const vus2 = new Set();
    for (let k = 0, essais = 0; k < 7 && essais < 60; essais++) {
      const bonne = pick(aps, 1)[0], pieges = pick(dehors, 3);
      const cle = bonne + pieges.slice().sort().join("|");
      if (vus2.has(cle)) continue; vus2.add(cle); k++;
      add("Régions de France", `Laquelle de ces appellations se trouve en ${reg} ?`, bonne, pieges, `${bonne} est en ${reg}. ` + pieges.map(p => `${p} : ${APPELLATIONS.find(a => a[0] === p)[1]}`).join(", ") + ".");
    }
  });
  // 6. Cépages : couleur, région, pays
  [...CEPAGES_FR, ...CEPAGES_MONDE].forEach(([c, coul]) => {
    add("Cépages", `${le(c)} est un cépage…`, coul === "blanc" ? "Blanc" : "Noir", [coul === "blanc" ? "Noir" : "Blanc"], `${le(c)} est un cépage ${coul}.`);
  });
  CEPAGES_FR.forEach(([c, coul, reg, aussi]) => {
    const ex = new Set([reg, ...aussi]); proches(reg).forEach(r => ex.add(r));
    add("Cépages", `Quelle région française est la plus emblématique ${du(c)} ?`, reg, pick(REGIONS_FR.filter(r => !ex.has(r)), 3), `${le(c)} est un cépage phare de la région ${reg}.`);
  });
  const paysTous = uniq([...CEPAGES_MONDE.map(c => c[2]), ...REGIONS_MONDE.map(r => r[1])]);
  CEPAGES_MONDE.forEach(([c, coul, pays]) => {
    add("Vins du monde", `De quel pays ${le(c).replace(/^L/, 'l')} est-il un cépage emblématique ?`, pays, pick(paysTous.filter(p => p !== pays), 3), `${le(c)} est un grand cépage de ce pays : ${pays}.`);
  });
  // 7. Régions du monde
  REGIONS_MONDE.forEach(([r, pays]) => {
    add("Vins du monde", `Dans quel pays se trouve la région viticole ${r} ?`, pays, pick(paysTous.filter(p => p !== pays), 3), `${r} : ${pays}.`);
  });
  const cepMonde = uniq(REGIONS_MONDE.map(r => r[2]).filter(Boolean));
  REGIONS_MONDE.forEach(([r, pays, cep]) => {
    if (!cep) return;
    add("Vins du monde", `Quel cépage est emblématique de la région ${r} (${pays}) ?`, cep, pick(cepMonde.filter(g => g !== cep), 3), `${r} est célèbre pour ${le(cep).replace(/^L/, 'l')}.`);
  });
  // 8. Arômes
  AROMES.forEach(([c, ar]) => {
    add("Dégustation", `Quels arômes sont typiques ${du(c)} ?`, ar, pick(AROMES.filter(x => x[0] !== c).map(x => x[1]), 3), `${ar} : c'est une signature ${du(c)}.`);
    add("Dégustation", `Des notes de « ${ar.toLowerCase()} » font penser à quel cépage ?`, c, pick(AROMES.filter(x => x[0] !== c).map(x => x[0]), 3), `${ar} : c'est une signature ${du(c)}.`);
  });
  // 9. Lexique
  LEXIQUE.forEach(([t, d]) => {
    const autres = LEXIQUE.filter(x => x[0] !== t);
    add("Vocabulaire", `Que signifie « ${t} » ?`, d, pick(autres.map(x => x[1]), 3), `${t} : ${d.charAt(0).toLowerCase() + d.slice(1)}.`);
    add("Vocabulaire", `Quel mot désigne : « ${d} » ?`, t, pick(autres.map(x => x[0]), 3), `${t} : ${d.charAt(0).toLowerCase() + d.slice(1)}.`);
  });
  // 10. Dosages
  DOSAGES.forEach(([m, s]) => {
    add("Champagne & bulles", `Quelle teneur en sucre correspond à la mention « ${m} » ?`, s, pick(DOSAGES.filter(x => x[0] !== m).map(x => x[1]), 3), `${m} : ${s.charAt(0).toLowerCase() + s.slice(1)}.`);
  });
  DOSAGES.slice(3).forEach(([m, s]) => {
    add("Champagne & bulles", `Un Champagne qui contient ${s.charAt(0).toLowerCase() + s.slice(1)} de sucre porte la mention :`, m, pick(DOSAGES.filter(x => x[0] !== m).map(x => x[0]), 3), `${s} : c'est un ${m}.`);
  });
  // 11. Bouteilles
  BOUTEILLES.forEach(([n, v]) => {
    add("Service", `En Champagne, quelle est la contenance du format « ${n} » ?`, v, pick(BOUTEILLES.filter(x => x[0] !== n).map(x => x[1]), 3), `« ${n} » : ${v}.`);
    add("Service", `En Champagne, comment s'appelle le format de ${v} ?`, n, pick(BOUTEILLES.filter(x => x[0] !== n).map(x => x[0]), 3), `${v} : « ${n} ».`);
  });
  // 12. Températures
  TEMPS.forEach(([v, i]) => {
    const pool = ECHELLE_T.filter((_, j) => Math.abs(j - i) >= 2);
    add("Service", `À quelle température sert-on ${v} ?`, ECHELLE_T[i], pick(pool, 3), `${v.charAt(0).toUpperCase() + v.slice(1)} se sert entre ${ECHELLE_T[i].replace(' à ', ' et ')}.`);
  });
  // 13. Nos bouteilles (calculé à partir des vraies fiches ; les fiches d'exemple sont exclues)
  const addN = (niv, ...args) => { const n = out.length; add(...args); if (out.length > n) out[n].niv = niv; };
  const VRAIS = WINES.filter(w => !w.domaine.includes("exemple"));
  const A_VALIDER = new Set(["hirsch-bv", "margalit-paradigma-2022", "delas-haute-pierre-2022", "pinzutu-2023", "golan-eliad-2023", "golan-ruach-2022"]);
  const PAYS_PIEGES = uniq([...VRAIS.map(w => w.pays), "France", "Espagne", "Italie", "Israël", "Portugal", "Argentine", "Chili", "Afrique du Sud"]);
  const COUL_NOM = { blanc: "Blanc", rouge: "Rouge", rose: "Rosé", orange: "Orange", bulles: "Effervescent" };
  const regionsCarte = uniq([...VRAIS.map(w => w.region), ...REGIONS_FR]).filter(Boolean);
  VRAIS.forEach(w => {
    const nom = `notre ${w.nom}${w.domaine ? " (" + w.domaine.replace(/\s*\(.*?\)/g, "") + ")" : ""}`;
    if (w.pays) addN("facile", "Notre carte", `De quel pays vient ${nom} ?`, w.pays, pick(PAYS_PIEGES.filter(p => p !== w.pays), 3), `${w.nom} : ${w.region ? w.region + ", " : ""}${w.pays}.`);
    if (w.couleur !== "bulles") addN("facile", "Notre carte", `De quelle couleur est ${nom} ?`, COUL_NOM[w.couleur], pick(Object.values(COUL_NOM).filter(c => c !== COUL_NOM[w.couleur]), 3), `${w.nom} est un vin ${COUL_NOM[w.couleur].toLowerCase()}.`);
    if (w.region) addN("connais", "Notre carte", `De quelle région vient ${nom} ?`, w.region, pick(regionsCarte.filter(r => r !== w.region && !proches(w.region).has(r)), 3), `${w.nom} : ${w.region}, ${w.pays}.`);
    const st = style(w.style);
    if (st) addN("connais", "Notre carte", `Dans quelle catégorie avons-nous rangé ${nom} ?`, st.nom, stylesDe(w.couleur).filter(s => s.id !== w.style).map(s => s.nom), `Sur notre carte, ${w.nom} est dans « ${st.nom} » : ${st.accroche.toLowerCase()}.`);
    if (w.cepages.length) { const autresCep = uniq([...VRAIS.flatMap(x => x.cepages), "Pinot Noir", "Chardonnay", "Sauvignon Blanc", "Malbec", "Nebbiolo"]).filter(c => !w.cepages.includes(c)); addN("connais", "Notre carte", `Quel est le cépage principal de ${nom} ?`, w.cepages[0], pick(autresCep, 3), `Cépage(s) : ${w.cepages.join(", ")}.`); }
    if (A_VALIDER.has(w.id)) return;
    const memeCoul = VRAIS.filter(x => x.id !== w.id && x.couleur === w.couleur);
    if (w.pitch && memeCoul.length >= 3) addN("connais", "Notre carte", `Quel vin de notre carte présente-t-on ainsi : « ${w.pitch} »`, w.nom, pick(memeCoul.map(x => x.nom), 3), `C'est la phrase de notre ${w.nom}.`);
    const autresMots = memeCoul.filter(x => !A_VALIDER.has(x.id) && (x.motsCles || []).length === 3).map(x => x.motsCles.join(" · "));
    if ((w.motsCles || []).length === 3 && autresMots.length >= 3) addN("connais", "Notre carte", `Quels sont les 3 mots de ${nom} ?`, w.motsCles.join(" · "), pick(autresMots, 3), `${w.nom} : ${w.motsCles.join(", ")}.`);
  });

  return out.map((q, i) => ({ id: i + 1, ...q }));
}

function initRecherche(couleur) {
  const box = $("#recherche"); if (!box) return;
  const q = $("#q"), filtres = $("#filtres"), res = $("#res-recherche"), zone = $("#cats-zone"), eff = $("#effacer"), bf = $("#btn-filtre"), nbf = $("#nb-filtres");
  const ws = carte().filter(w => w.couleur === couleur);
  const actifs = () => [...filtres.querySelectorAll("input:checked")].map(b => [b.dataset.k, b.value]);
  const maj = () => {
    const t = sansAccent(q.value.trim()), f = actifs();
    eff.hidden = !q.value; nbf.hidden = !f.length; nbf.textContent = f.length;
    if (!t && !f.length) { res.innerHTML = ""; zone.hidden = false; return; }
    const ceps = f.filter(([k]) => k === "cep").map(([, v]) => v);
    const stys = f.filter(([k]) => k === "sty").map(([, v]) => v);
    const liste = ws.filter(w => {
      const wc = w.cepages || [];
      if (t) { const txt = sansAccent([w.nom, w.domaine, w.appellation, w.region, w.pays, wc.join(" "), w.assemblage, (w.motsCles || []).join(" "), w.millesime].join(" ")); if (!t.split(/\s+/).every(m => txt.includes(m))) return false; }
      if (ceps.length && !ceps.some(c => wc.includes(c))) return false;
      if (stys.length && !stys.includes(w.style)) return false;
      const mono = f.some(([k]) => k === "mono"), ass = f.some(([k]) => k === "ass");
      if (mono && !ass && wc.length !== 1) return false;
      if (ass && !mono && wc.length < 2) return false;
      if (f.some(([k]) => k === "ss") && !w.sansSulfites) return false;
      return true;
    });
    zone.hidden = true;
    res.innerHTML = `<p class="eyebrow compte">${nb(liste.length)} trouvé${liste.length > 1 ? "s" : ""}</p>` + (liste.length ? `<div class="wines">${liste.map(wineRow).join("")}</div>` : `<p class="empty">Aucun vin ne correspond. Essayez un autre mot ou retirez un filtre.</p>`);
  };
  const ouvrir = v => { filtres.hidden = !v; bf.setAttribute("aria-expanded", v); box.classList.toggle("ouvert", v); };
  bf.onclick = e => { e.preventDefault(); e.stopPropagation(); ouvrir(filtres.hidden); };
  q.addEventListener("input", maj);
  eff.onclick = e => { e.preventDefault(); q.value = ""; maj(); q.focus(); };
  filtres.querySelectorAll("input").forEach(i => i.onchange = maj);
  $("#tout-effacer").onclick = () => { filtres.querySelectorAll("input").forEach(i => i.checked = false); maj(); };
  $("#voir").onclick = () => { ouvrir(false); maj(); res.scrollIntoView({ behavior: "smooth", block: "start" }); };
}

function tirerDix(niv) {
  let vus = new Set(store.get("vin_vus", []));
  const base = QUESTIONS.filter(q => !niv || q.niv === niv);
  let pool = base.filter(q => !vus.has(q.id));
  if (pool.length < 10) { base.forEach(q => vus.delete(q.id)); pool = base.slice(); }
  const choix = [], textes = new Set(), parTheme = {};
  for (const q of shuffle(pool)) {
    if (textes.has(q.q) || (parTheme[q.theme] || 0) >= 3) continue;
    choix.push({ ...q, options: shuffle([q.a, ...q.w]) }); textes.add(q.q); parTheme[q.theme] = (parTheme[q.theme] || 0) + 1;
    if (choix.length === 10) break;
  }
  if (choix.length < 10) for (const q of shuffle(pool)) {
    if (textes.has(q.q)) continue;
    choix.push({ ...q, options: shuffle([q.a, ...q.w]) }); textes.add(q.q);
    if (choix.length === 10) break;
  }
  choix.forEach(q => vus.add(q.id)); store.set("vin_vus", [...vus]);
  return choix;
}

    ${erreurs.length ? `<section class="section"><h2>À revoir</h2><div class="review">${erreurs.map(({ q, r }) => `<div><b style="font-family:var(--display);font-size:1.25rem;font-weight:500">${qTitre(q)}</b>${WB_LANG === "he" && q.qc ? vinTag(q, 1) : ""}<span style="color:var(--ko)">Votre réponse : ${esc(r.choix)}</span><span class="good-a">Bonne réponse : ${esc(q.a)}</span><span style="color:var(--muted)">${esc(q.x)}</span></div>`).join("")}</div></section>` : ""}`;
  $("#again").onclick = () => { QZ = { phase: "q", list: tirerDix(QZ.niv), i: 0, rep: [], saved: null, prenom: QZ.prenom, niv: QZ.niv }; renderQuiz(); window.scrollTo({ top: 0 }); };

let DB = null, USER = null, UID = null;
async function enregistrer() {

async function pageResultats() {
  const box = $("#resbox"); if (!box) return;
  if (!IS_OWNER || !DB) { box.innerHTML = `<p class="empty">Cette page est réservée à la sommelière.</p>`; return; }
  let fini = false;
  const t = setTimeout(() => { if (!fini) box.innerHTML = `<p class="empty">Les résultats ne sont pas joignables pour le moment. Réessayez dans un instant.</p>`; }, 10000);
  try {
    const snap = await DB.collection("resultats").get(); fini = true; clearTimeout(t);
    let rows = snap.docs.map(d => d.data()).filter(d => d && d.essais && d.essais.length)
      .map(d => { const s = d.essais.map(e => e.s); return { ...d, nb: s.length, moy: s.reduce((a, b) => a + b, 0) / s.length, best: Math.max(...s), last: d.essais[d.essais.length - 1] }; })
      .sort((a, b) => (b.maj || "").localeCompare(a.maj || ""));
    const draw = () => {
      const vis = rows.filter(r => !RES_FILTRE || r.resto === RES_FILTRE);
      const date = iso => new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      box.innerHTML = `<div class="tabs" role="tablist"><button class="tab" data-f="" aria-selected="${!RES_FILTRE}">Tous</button>${RESTOS.map(r => `<button class="tab" data-f="${r.id}" aria-selected="${RES_FILTRE === r.id}">${esc(r.nom)}</button>`).join("")}</div>
      ${vis.length ? `<div class="scroll-x"><table class="res"><thead><tr><th>Prénom</th><th>Restaurant</th><th class="num">Quiz</th><th class="num">Moyenne</th><th class="num">Meilleur</th><th class="num">Dernier</th><th>Évolution</th><th>Date</th></tr></thead><tbody>
      ${vis.map(r => `<tr><td>${esc(r.prenom || "Sans nom")}</td><td>${esc(resto(r.resto)?.nom || "—")}</td><td class="num">${r.nb}</td><td class="num">${r.moy.toFixed(1)}</td><td class="num">${r.best}</td><td class="num">${r.last.s}/10</td>
        <td><span class="spark">${r.essais.slice(-10).map(e => `<i style="height:${Math.max(2, e.s * 2.2)}px" title="${e.s}/10"></i>`).join("")}</span></td><td>${date(r.last.d)}</td></tr>`).join("")}</tbody></table></div>`
        : `<p class="empty">Aucun quiz enregistré pour l'instant.</p>`}`;
      box.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { RES_FILTRE = b.dataset.f; draw(); });
    };
    draw();
  } catch (e) { fini = true; clearTimeout(t); box.innerHTML = `<p class="empty">Impossible de charger les résultats. Réessayez dans un instant.</p>`; }
}
PAGES.resultats = () => `<header class="section center"><p class="eyebrow">Suivi de l'équipe</p><h1>Résultats des quiz</h1><p class="lead">Pour chaque personne : nombre de quiz, moyenne, meilleur score et évolution.</p></header><div id="resbox"><p class="empty">Chargement…</p></div>`;

/* ---------- Bouton retour ---------- */
let NAV_PROF = 0;
window.addEventListener("hashchange", () => { NAV_PROF++; });
function parentDe(h) {
  let m;
  if (h.startsWith("vin-")) { const w = WINES.find(x => x.id === h.slice(4)); if (w) return style(w.style) ? `${w.couleur}-${w.style}` : `couleur-${w.couleur}`; }
  if ((m = h.match(/^(blanc|rouge|rose|orange|bulles)-/))) return `couleur-${m[1]}`;
  if (h.startsWith("couleur-")) return "carte";
  return "accueil";
}
/* ---------- Routeur ---------- */
function route() {
  const h = (location.hash || "#accueil").slice(1) || "accueil";
  // ranger l'atelier du vigneron avant de changer de page
  const at = $("#atelier"); if (at && at.parentElement.id !== "atelier-holder") $("#atelier-holder").appendChild(at);
  let html = null, m;
  if (PAGES[h]) html = PAGES[h]();
  else if (h.startsWith("couleur-")) html = pageCouleur(h.slice(8));
  else if (h.startsWith("vin-")) html = pageVin(h.slice(4));
  else if ((m = h.match(/^(blanc|rouge|rose|orange|bulles)-(facile|fruite|complexe|avance|champagne|effervescent|mineral|floral|aromatique|rond|leger|elegant|puissant)$/))) html = pageCategorie(m[1], m[2]);
  let page = PAGES[h] ? h : "autre";
  if (html === null) { html = PAGES.accueil(); page = "accueil"; }
  document.body.dataset.page = page;
  $("#app").innerHTML = (page === "accueil" ? "" : `<button class="retour" id="retour" aria-label="Revenir à la page précédente" title="Retour"><span aria-hidden="true">←</span></button>`) + html;
  const rb = $("#retour"); if (rb) rb.onclick = () => { if (NAV_PROF > 0) history.back(); else location.hash = parentDe(h); };
  renderNav(h);
  document.querySelectorAll("button[data-r]").forEach(b => b.onclick = () => { RESTO = b.dataset.r; store.set("vin_resto", RESTO); location.hash = "carte"; });
  if (h === "fabrication") {
    $("#atelier-place").appendChild($("#atelier"));
    document.querySelectorAll("#versions button").forEach(b => { b.hidden = false; }); $("#versions").hidden = false;
    renderEtapes();
    document.querySelectorAll(".tab[data-t]").forEach(b => b.onclick = () => { FAB_T = b.dataset.t; document.querySelectorAll(".tab[data-t]").forEach(x => x.setAttribute("aria-selected", x === b)); renderEtapes(); });
  }
  if (h.startsWith("couleur-")) {
    initRecherche(h.slice(8));
    const cid = h.slice(8), versions = { blanc: ["blanc"], rouge: ["rouge"], rose: ["rose"], orange: ["orange"], bulles: ["champagne", "effervescent"] }[cid];
    if (versions && $("#atelier-place")) {
      $("#atelier-place").appendChild($("#atelier"));
      document.querySelectorAll("#versions button").forEach(b => { b.hidden = !versions.includes(b.dataset.v); });
      $("#versions").hidden = versions.length < 2;
      const b = document.querySelector(`#versions button[data-v="${versions[0]}"]`); if (b) b.click();
    }
  }
  if (h === "quiz") { if (QZ.phase === "end") QZ.phase = "start"; renderQuiz(); }
  if (h === "resultats") pageResultats();
}
window.addEventListener("hashchange", () => { route(); window.scrollTo({ top: 0 }); });
route();

(async () => {
  try {
    return; // Enregistrement des scores désactivé (21/11 : pas de connexion demandée aux serveurs)
    if (!window.claude || typeof window.claude.use !== "function") return;
    USER = await window.claude.use("user");
    DB = await window.claude.use("db");
    if (USER) {
      try { UID = await USER.id(); } catch {}
      try { IS_OWNER = !!(await USER.isOwner()); } catch {}
    }
    renderNav((location.hash || "#accueil").slice(1));
    if (location.hash === "#resultats") pageResultats();
  } catch {}
})();

/* ---------- Horloge pausable ---------- */
let T = 0, last = null, paused = false, speed = 2.6, tweens = [];
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const lin = p => p;
function tween(dur, fn, e = ease) { return new Promise(r => tweens.push({ s: T, d: dur, fn, e, r })); }
const wait = ms => tween(ms, () => {});
function frame(ts) {
  if (last === null) last = ts;
  const dt = Math.min(64, ts - last); last = ts;
  if (!paused) T += dt * speed;
  for (const tw of tweens.slice()) {
    const Tq = Math.floor(T / 83) * 83;
    const p = Math.min(1, Math.max(0, (Tq - tw.s) / tw.d));
    tw.fn(tw.e(p), p);
    if (p >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.r(); }
  }
  draw();
  if (!SEEKING && !GLISSE) majBarre();
  requestAnimationFrame(frame);
}

  const a = (arm === "F" ? M.armF : M.armB) * Math.PI / 180;
  const sx = arm === "F" ? 10 : -6;
  return { x: M.x + sx - 62 * Math.sin(a), y: 470 + SHOULDER_Y + M.bob + 62 * Math.cos(a) };
}
function draw() {
  const legA = Math.sin(M.phase) * 30;
  S($("man"), { transform: `translate(${M.x},${470 + M.bob})` });
  S($("legL"), { transform: `translate(-8,-70) rotate(${legA})` });
  S($("legR"), { transform: `translate(8,-70) rotate(${-legA})` });
  S($("armFront"), { transform: `translate(10,${SHOULDER_Y}) rotate(${M.armF})` });
  S($("armBack"), { transform: `translate(-6,${SHOULDER_Y}) rotate(${M.armB})` });
  if (M.holding) {
    const h = hand("F"), o = M.holding;
    S(o.el, { transform: `translate(${h.x + (o.dx || 0)},${h.y + (o.dy || 0)}) rotate(${o.rot || 0})` });
  }
  // caméra : gros plan qui suit le vigneron
  const cible = Math.max(0, Math.min(WORLD - CAM_W, M.x - CAM_W * 0.36));
  CAM = CAM_SNAP ? cible : CAM + (cible - CAM) * 0.07;
  CAM_SNAP = false;
  S($("scene"), { viewBox: `${CAM.toFixed(1)} ${CAM_Y} ${CAM_W} ${CAM_H}` });
  S($("sun"), { cx: CAM + 520, cy: 175 });
}
async function walk(to, msPerPx = 5) {
  const from = M.x, dist = Math.abs(to - from), armF0 = M.armF, armB0 = M.armB;
  if (dist < 1) return;
  await tween(dist * msPerPx, p => {
    M.x = from + (to - from) * p;
    M.phase = (M.x - from) * 0.07;
    M.bob = -Math.abs(Math.sin(M.phase)) * 9;
    M.armB = armB0 + Math.sin(M.phase) * 18;
    if (!M.holding) M.armF = armF0 - Math.sin(M.phase) * 18;
  }, lin);
  M.phase = 0; M.bob = 0; M.armB = armB0; M.armF = armF0;
}
const armTo = (deg, ms = 500, which = "F") => { const k = which === "F" ? "armF" : "armB", a = M[k]; return tween(ms, p => { M[k] = a + (deg - a) * p; }); };

}

/* Bulle : texte sur plusieurs lignes, taille adaptée */
let BULLE_ID = 0;
function bubbleSet(text) {
  BULLE_ID++; text = window.TR ? TR(text) : text;
  const mots = String(text).split(" "), lignes = []; let l = "";
  for (const m of mots) { if ((l + " " + m).trim().length > 21 && l) { lignes.push(l); l = m; } else l = (l + " " + m).trim(); }
  if (l) lignes.push(l);
  const lh = 21, h = 22 + lignes.length * lh, top = -184 - h, w = 252;
  S($("bubblePath"), { d: `M18,${top} h${w - 32} a14,14 0 0 1 14,14 v${h - 28} a14,14 0 0 1 -14,14 h-184 l-20,18 l4,-18 h-20 a14,14 0 0 1 -14,-14 v${-(h - 28)} a14,14 0 0 1 14,-14 z` });
  const t = $("bubbleText"); t.setAttribute("font-size", "17"); t.setAttribute("y", top + 11);
  t.innerHTML = lignes.map((x, k) => `<tspan x="128" dy="${k ? lh : 18}">${x.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</tspan>`).join("");
  return BULLE_ID;
}
function bulleEtape(text) { // bulle non bloquante, disparaît seule

  tween(250, p => $("bubble").setAttribute("opacity", p)).then(() => wait(2600)).then(() => { if (BULLE_ID === id) tween(250, p => { if (BULLE_ID === id) $("bubble").setAttribute("opacity", 1 - p); }); });
}

    const h = hand(); const sx = h.x + 30, sy = h.y + 10;

/* ---------- Lecteur : play / pause / barre ---------- */
let T0 = 0, FINI = false, DEMARRE = false, SEEKING = false, GLISSE = false, CHOIX_MEMO = true;
const DUREES = { rouge: 61500, blanc: 58600, rose: 61900, orange: 63400, effervescent: 49100, champagne: 56400 };
function dureeV() { return DUREES[V] || 60000; }
function majBarre() {
  const el = $("seek"); if (!el) return;
  const pct = DEMARRE ? (FINI ? 1 : Math.min(1, (T - T0) / dureeV())) : 0;
  el.value = Math.round(pct * 1000); el.style.setProperty("--pct", (pct * 100).toFixed(1) + "%");
}
function majLecteur() {
  const enLecture = DEMARRE && !FINI && !paused;
  $("lpIcon").setAttribute("d", enLecture ? "M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" : "M8 5.5v13l11-6.5z");
  $("lp").setAttribute("aria-label", enLecture ? "Pause" : "Lecture");
  $("bigplay").classList.toggle("off", enLecture || (DEMARRE && !FINI));
  majBarre();
}
function lecture() {
  if (!DEMARRE || FINI) { paused = false; film().catch(() => {}); }
  else paused = false;
  majLecteur();
}
function pauseLecture() { if (DEMARRE && !FINI) { paused = true; majLecteur(); } }
$("bigplay").onclick = lecture;
document.querySelector(".stage-wrap").addEventListener("click", e => { if (e.target.closest("button")) return; if (DEMARRE && !FINI) (paused ? lecture() : pauseLecture()); });
$("lp").onclick = () => (DEMARRE && !FINI && !paused) ? pauseLecture() : lecture();
const cedeMain = () => new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });
function avancerHorloge(dt) {
  T += dt;
  for (const tw of tweens.slice()) {
    const p = Math.min(1, Math.max(0, (T - tw.s) / tw.d));
    tw.fn(tw.e(p), p);
    if (p >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.r(); }
  }
}
let SAUT = 0;
async function sauter(frac) {
  const id = ++SAUT;
  const cible = frac * dureeV();
  const etaitPause = paused || !DEMARRE;
  SEEKING = true; paused = true;
  if (!DEMARRE || FINI || cible < T - T0) { film().catch(() => {}); paused = true; await cedeMain(); }
  let n = 0;
  while (id === SAUT && !FINI && T - T0 < cible) {
    avancerHorloge(Math.min(120, cible - (T - T0)));
    for (let k = 0; k < 6; k++) await null;
    if (++n % 40 === 0) await cedeMain();
  }
  if (id !== SAUT) return;
  SEEKING = false; paused = etaitPause; CAM_SNAP = true; draw(); majLecteur();
}
const seek = $("seek");
seek.addEventListener("pointerdown", () => { GLISSE = true; });
seek.addEventListener("input", () => { seek.style.setProperty("--pct", (seek.value / 10) + "%"); sauter(seek.value / 1000); });
const finGlisse = () => { GLISSE = false; };
seek.addEventListener("pointerup", finGlisse); seek.addEventListener("change", finGlisse); seek.addEventListener("pointercancel", finGlisse);

function setFace(url) {
  if (url) { $("facePhoto").setAttribute("href", url); $("facePhoto").style.display = ""; $("faceDefault").style.display = "none"; $("photoPreview").src = url; }
  else { $("facePhoto").style.display = "none"; $("faceDefault").style.display = ""; $("photoPreview").src = $("photoPreview").dataset.def; }
  $("headEdge").style.display = url ? "" : "none";
}

$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;

  img.onload = () => {
    const s = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = 300;
    c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 300, 300);
    const url = c.toDataURL("image/jpeg", .85);
    setFace(url); try { localStorage.setItem("vigneron_photo", url); } catch {}

  };

};

  const texte = WB_LANG === "he" ? (ios ? "הקישו על <b style='display:inline;font:inherit;font-weight:500'>שיתוף</b> בתחתית המסך, ואז על <b style='display:inline;font:inherit;font-weight:500'>הוספה למסך הבית</b>." : "פתחו את התפריט ⋮ של הדפדפן, ואז <b style='display:inline;font:inherit;font-weight:500'>התקנת האפליקציה</b> או <b style='display:inline;font:inherit;font-weight:500'>הוספה למסך הבית</b>.") : ios
    ? "Touchez <b style='display:inline;font:inherit;font-weight:500'>Partager</b> en bas de l'écran, puis <b style='display:inline;font:inherit;font-weight:500'>Sur l'écran d'accueil</b>."
    : "Ouvrez le menu ⋮ du navigateur, puis <b style='display:inline;font:inherit;font-weight:500'>Installer l'application</b> ou <b style='display:inline;font:inherit;font-weight:500'>Ajouter à l'écran d'accueil</b>.";
  box.innerHTML = `<img src="apple-touch-icon.png" alt=""><div><b>Installer Wine Book</b><p>${texte}</p></div><button class="x" aria-label="Fermer">×</button>`;
  box.querySelector(".x").onclick = fermer;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); prompt = e;
    box.querySelector("p").textContent = "Ajoutez l'appli sur votre écran d'accueil.";
    if (!box.querySelector(".ok")) { const b = document.createElement("button"); b.className = "btn ok"; b.textContent = "Installer"; b.onclick = async () => { prompt.prompt(); await prompt.userChoice; fermer(); }; box.appendChild(b); }
  });
  setTimeout(() => document.body.appendChild(box), 1500);
})();
</script>
<script>
/* Mise à jour automatique : si une version plus récente est en ligne, on recharge. */
const WB_BUILD = "2026-11-24-zc";
(function(){
  function verifier(){
    fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" }).then(r => r.text()).then(t => {
      const m = t.match(/WB_BUILD = "([^"]+)"/);
      if (m && m[1] !== WB_BUILD) {
        let deja = null; try { deja = sessionStorage.getItem("wb_reload"); } catch {}
        if (deja !== m[1]) { try { sessionStorage.setItem("wb_reload", m[1]); } catch {} location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]) + location.hash); }
      }
    }).catch(() => {});
  }
  verifier();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") verifier(); });
})();
</script>
