<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f5ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wine Book">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Wine Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Direction : maison de palace. Noir profond, ivoire, filets dorés, beaucoup d'air.
   Serif haute couture pour les titres, sans-serif fine pour le texte, capitales espacées pour les repères.
   Un seul thème, volontairement sombre. */
:root {
  --bg: #f8f5ef; --surface: #fdfbf7; --surface-2: #f1ece3; --ink: #2a2520; --muted: #7a7066; --faint: #a9a095;
  --line: #e8e1d5; --gold: #8c3b3b; --gold-soft: #ddbcb9; --sage-1: #dfe5d3; --sage-2: #4f5d45; --wine: #8a2738; --ok: #3f7a4a; --ko: #b2463a;
  --display: "Lora", Georgia, serif;
  --body: "Work Sans", "Helvetica Neue", Arial, sans-serif;
  --c-blanc: #d8bf5f; --c-rouge: #8a2738; --c-rose: #e09a8c; --c-orange: #cf8133; --c-bulles: #d9c78c;
  color-scheme: light;
}
/* Direction : vigne poudrée. Fond rose-mauve très pâle, encre prune, cartes douces arrondies, titres Instrument Serif. Un seul thème clair. */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-weight: 400; font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; letter-spacing: .01em; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.1; text-wrap: balance; margin: 0; letter-spacing: .005em; }
h1 { font-size: clamp(2.3rem, 6vw, 3.6rem); font-style: normal; }
h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
h3 { font-size: 1.45rem; }
p { margin: 0; }
a { color: inherit; }
b, strong { font-weight: 500; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; }
::selection { background: var(--gold); color: var(--bg); }

.eyebrow { font-family: var(--body); font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); font-weight: 400; }
.rule { display: flex; align-items: center; gap: 14px; color: var(--gold); }
.rule::before, .rule::after { content: ""; height: 1px; background: var(--gold-soft); flex: 1; }
.rule.left::before { display: none; }
.lead { color: var(--muted); max-width: 62ch; font-size: 1.05rem; }
.center { text-align: center; justify-items: center; }
.center .lead { margin-inline: auto; }

/* ---------- En-tête ---------- */
.top { position: sticky; top: 0; z-index: 20; background: rgba(248,245,239,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 20px; }
.brand { text-decoration: none; display: grid; line-height: 1.1; }
.brand b { font-family: var(--display); font-weight: 500; font-size: 1.45rem; letter-spacing: .04em; }
.brand span { font-size: .62rem; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
.nav { display: flex; gap: 26px; margin-left: auto; align-items: center; }
.nav a { text-decoration: none; font-size: .74rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); padding: 6px 0; border-bottom: 1px solid transparent; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--gold); }
.resto-switch { border-radius: 999px; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); text-decoration: none; border: 1px solid var(--gold-soft); padding: 6px 12px; white-space: nowrap; }
.resto-switch:hover { background: var(--gold); color: var(--bg); }
.tabbar { display: none; }
@media (max-width: 820px) {
  .nav { display: none; }
  .resto-switch { margin-left: auto; }
  .tabbar { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: rgba(253,251,247,.98); border-top: 1px solid var(--line); padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: .6rem; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  .tabbar a svg { width: 20px; height: 20px; }
  .tabbar a[aria-current="page"] { color: var(--gold); }
  main { padding-bottom: 110px !important; }
}

main { max-width: 1120px; margin: 0 auto; padding: 48px 20px 80px; display: grid; gap: 48px; }
.section { display: grid; gap: 18px; }
.crumb { font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); display: flex; gap: 10px; flex-wrap: wrap; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--gold); }
.note { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--muted); padding: 14px 0; font-size: .88rem; text-align: center; }
.note b { color: var(--gold); font-weight: 400; }
.btn { border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); padding: 13px 26px; cursor: pointer; text-decoration: none;
  font-size: .74rem; letter-spacing: .24em; text-transform: uppercase; font-weight: 500; transition: background .2s, color .2s; }
.btn:hover { background: transparent; color: var(--ink); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--gold); color: var(--gold); }
.btn:disabled { opacity: .35; cursor: default; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.empty { color: var(--faint); font-style: normal; font-family: var(--display); font-size: 1.15rem; }

/* ---------- Choix du restaurant ---------- */
.welcome { min-height: calc(100vh - 220px); display: grid; align-content: center; gap: 44px; }
.restos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
@media (max-width: 640px) { .restos { grid-template-columns: 1fr; } }
.resto { position: relative; display: grid; place-items: center; text-align: center; gap: 10px; padding: 64px 24px; text-decoration: none; background: var(--surface);
  border: 1px solid var(--line); transition: border-color .3s, background .3s; cursor: pointer; }
.resto::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--line); pointer-events: none; transition: border-color .3s; }
.resto:hover, .resto[aria-current="true"] { border-color: var(--gold-soft); background: var(--surface-2); }
.resto:hover::before, .resto[aria-current="true"]::before { border-color: var(--gold-soft); }
.resto b { font-family: var(--display); font-weight: 400; font-size: clamp(2.4rem, 6vw, 3.4rem); line-height: 1; }
.resto span { font-size: .7rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
.extras { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
@media (max-width: 640px) { .extras { grid-template-columns: 1fr; } }
.extra { display: grid; gap: 8px; padding: 26px 0; border-top: 1px solid var(--line); text-decoration: none; }
.extra:hover h3 { color: var(--gold); }
.extra p { color: var(--muted); }

/* ---------- Choix de la couleur ---------- */
.colors { display: grid; border-top: 1px solid var(--line); }
.color-row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 24px; padding: 26px 4px; border-bottom: 1px solid var(--line); text-decoration: none; transition: padding .3s, background .3s; }
.color-row:hover { background: var(--surface); padding-left: 18px; }
.color-row h2 { font-size: clamp(2rem, 5vw, 2.9rem); }
.color-row p { color: var(--muted); font-size: .92rem; max-width: 56ch; }
.color-row .n { font-size: .7rem; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
.swatch { width: 44px; height: 58px; }
@media (max-width: 560px) { .color-row { grid-template-columns: 40px 1fr; } .color-row .n { grid-column: 2; } .swatch { width: 32px; height: 42px; } }

/* ---------- Catégories ---------- */
.page-head { display: grid; gap: 14px; }
.page-head .bar { width: 64px; height: 2px; background: var(--c, var(--gold)); }
.cats { border-radius: 24px; overflow: hidden; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
@media (max-width: 640px) { .cats { grid-template-columns: 1fr; } }
.cat { background: var(--bg); padding: 34px 30px; display: grid; gap: 10px; text-decoration: none; transition: background .3s; }
.cat:hover { background: var(--surface); }
.cat .num { font-family: var(--display); font-size: 1rem; color: var(--gold); font-style: normal; }
.cat h3 { font-size: 1.9rem; }
.cat p { color: var(--muted); font-size: .95rem; }
.cat .n { font-size: .68rem; letter-spacing: .24em; text-transform: uppercase; color: var(--faint); }
.cat.vide .n { color: var(--faint); }

/* ---------- Page catégorie ---------- */
.two { display: grid; gap: 40px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.block { display: grid; gap: 14px; align-content: start; }
.block h3 { font-size: 1.35rem; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.list li { padding-left: 20px; position: relative; color: var(--ink); }
.list li::before { content: ""; position: absolute; left: 0; top: .78em; width: 9px; height: 1px; background: var(--gold); }
.list.avoid li::before { background: var(--ko); }
.say { display: grid; gap: 14px; }
.say p { font-family: var(--display); font-style: normal; font-size: 1.35rem; line-height: 1.35; padding-left: 20px; border-left: 1px solid var(--gold-soft); }
.wines { display: grid; border-top: 1px solid var(--line); }
.wine { display: grid; grid-template-columns: 3px 1fr auto; gap: 22px; align-items: center; padding: 24px 0; border-bottom: 1px solid var(--line); text-decoration: none; transition: background .3s; }
.wine:hover { background: var(--surface); }
.wine .band { align-self: stretch; background: var(--c); }
.wine .in { display: grid; gap: 4px; }
.wine h3 { font-size: 1.6rem; }
.wine .meta { color: var(--gold); font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; }
.wine .pitch { color: var(--muted); font-size: .95rem; }
.wine .go { font-family: var(--display); font-size: 1.6rem; color: var(--gold); padding-right: 8px; }

/* ---------- Fiche vin ---------- */
.fiche-head { display: grid; gap: 18px; text-align: center; justify-items: center; padding-bottom: 36px; border-bottom: 1px solid var(--line); }
.fiche-head h1 { font-size: clamp(2.5rem, 7vw, 4.2rem); }
.fiche-head .dom { font-family: var(--display); font-style: normal; font-size: 1.3rem; color: var(--muted); }
.tags { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.tag { font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold-soft); padding: 5px 12px; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
.tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.facts { border-radius: 18px; overflow: hidden; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); width: 100%; }
.fact { background: var(--bg); padding: 16px; display: grid; gap: 4px; text-align: center; }
.fact span { font-size: .64rem; color: var(--faint); text-transform: uppercase; letter-spacing: .24em; }
.fact b { font-family: var(--display); font-weight: 500; font-size: 1.2rem; }
.pitch-box { text-align: center; display: grid; gap: 14px; padding: 10px 0; }
.pitch-box p { font-family: var(--display); font-style: normal; font-size: clamp(1.5rem, 3.6vw, 2.1rem); line-height: 1.3; max-width: 30ch; margin: 0 auto; }
.bars { display: grid; gap: 12px; }
.bar { display: grid; grid-template-columns: 80px 1fr; gap: 14px; align-items: center; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.bar .track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.bar .track i { height: 3px; background: var(--line); }
.bar .track i.on { background: var(--gold); }
.taste { display: grid; gap: 14px; margin: 0; }
.taste div { display: grid; grid-template-columns: 90px 1fr; gap: 14px; }
.taste dt { font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); padding-top: .3em; }
.taste dd { margin: 0; }
.keywords { display: flex; gap: 10px; flex-wrap: wrap; }
.keywords span { font-family: var(--display); font-style: normal; font-size: 1.1rem; color: var(--muted); }
.keywords span + span::before { content: "·"; margin-right: 10px; color: var(--gold); font-style: normal; }
.story { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 34px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.story p { font-family: var(--display); font-size: 1.35rem; line-height: 1.45; max-width: 46ch; }
.prevnext { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------- Fabrication ---------- */
.atelier { border: 1px solid var(--line); padding: 14px; background: var(--surface); display: grid; gap: 14px; }
.stage-wrap { position: relative; overflow: hidden; background: #cfe6f2; }
svg#scene { display: block; width: 100%; height: auto; }
.choice { position: absolute; inset: auto 0 6% 0; display: none; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 12px; }
.choice.on { display: flex; }
.choice .btn { box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.choice .btn.ghost { background: var(--bg); }
.vbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.vbar select { background: var(--bg); border: 1px solid var(--line); padding: 10px 12px; font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; }
.caption { display: grid; gap: 6px; min-height: 86px; padding: 6px 4px; }
.caption p { font-family: var(--display); font-size: 1.35rem; line-height: 1.35; }
.steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 0; padding: 0; }
.steps li { list-style: none; background: var(--bg); padding: 10px 6px; font-size: .64rem; letter-spacing: .18em; text-transform: uppercase; text-align: center; color: var(--faint); }
.steps li b { display: block; font-family: var(--display); font-size: 1.2rem; letter-spacing: 0; color: var(--muted); font-weight: 400; }
.steps li.on { background: var(--gold); color: var(--bg); }
.steps li.on b { color: var(--bg); }
.steps li.done b { color: var(--gold); }
@media (max-width: 640px) { .steps { grid-template-columns: repeat(3, 1fr); } }
.photo { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); font-size: .9rem; color: var(--muted); }
.photo img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 1px solid var(--gold-soft); }
.photo .btn { padding: 9px 16px; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.tabs { display: flex; gap: 26px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; padding: 12px 0; cursor: pointer; white-space: nowrap; font-size: .74rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.etapes { display: grid; gap: 0; counter-reset: e; }
.etape { display: grid; grid-template-columns: 60px 1fr; gap: 18px; padding: 22px 0; border-bottom: 1px solid var(--line); }
.etape .k { font-family: var(--display); font-size: 2rem; color: var(--gold); line-height: 1; }
.etape h3 { font-size: 1.4rem; margin-bottom: 6px; }
.etape p { color: var(--muted); }
.etape .cle { color: var(--ink); margin-top: 8px; font-family: var(--display); font-style: normal; font-size: 1.15rem; }
.compare { width: 100%; border-collapse: collapse; font-size: .92rem; }
.compare th, .compare td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.compare th { font-weight: 400; color: var(--gold); font-size: .66rem; text-transform: uppercase; letter-spacing: .22em; }
.compare td:first-child { font-family: var(--display); font-size: 1.15rem; }
.scroll-x { overflow-x: auto; }

/* ---------- Quiz ---------- */
.quiz { display: grid; gap: 28px; max-width: 760px; margin: 0 auto; width: 100%; }
.field { display: grid; gap: 8px; }
.field label { font-size: .7rem; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.field input { padding: 14px 0; border: 0; border-bottom: 1px solid var(--gold-soft); background: transparent; font-family: var(--display); font-size: 1.6rem; }
.field input:focus { outline: none; border-bottom-color: var(--gold); }
.progress { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.progress i { height: 2px; background: var(--line); }
.progress i.ok { background: var(--ok); } .progress i.ko { background: var(--ko); } .progress i.cur { background: var(--gold); }
.qcard { display: grid; gap: 22px; }
.qcard h2 { font-size: clamp(1.7rem, 4.5vw, 2.3rem); }
.answers { display: grid; border-top: 1px solid var(--line); }
.answer { text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 18px 8px; cursor: pointer; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: baseline; font-size: 1.02rem; transition: background .2s; }
.answer:hover:not(:disabled) { background: var(--surface); }
.answer .k { font-family: var(--display); font-style: normal; font-size: 1.2rem; color: var(--gold); }
.answer.good { background: rgba(63,122,74,.1); } .answer.good .k { color: var(--ok); }
.answer.bad { background: rgba(178,70,58,.1); } .answer.bad .k { color: var(--ko); }
.answer:disabled { cursor: default; }
.explain { display: grid; gap: 6px; padding: 18px 20px; background: var(--surface); border-left: 1px solid var(--gold); }
.explain b.ok { color: var(--ok); font-weight: 400; } .explain b.ko { color: var(--ko); font-weight: 400; }
.score { display: grid; gap: 10px; text-align: center; padding: 30px 0; }
.score .big { display: block; width: auto; text-align: center; direction: ltr; unicode-bidi: isolate; background: none; box-shadow: none; padding: 0; border-radius: 0; cursor: default; font-family: var(--display); font-size: clamp(5rem, 16vw, 8rem); line-height: 1; font-variant-numeric: tabular-nums; }
.score .lead { font-family: var(--display); font-style: normal; font-size: 1.4rem; margin: 0 auto; }
.review { display: grid; gap: 0; border-top: 1px solid var(--line); }
.review > div { display: grid; gap: 4px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.review .good-a { color: var(--ok); }
.saved { font-size: .82rem; letter-spacing: .06em; color: var(--muted); text-align: center; }
table.res { width: 100%; border-collapse: collapse; font-size: .94rem; }
table.res th, table.res td { padding: 14px 10px; border-bottom: 1px solid var(--line); text-align: left; }
table.res th { font-weight: 400; color: var(--gold); font-size: .64rem; text-transform: uppercase; letter-spacing: .22em; }
table.res td.num, table.res th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.res td:first-child { font-family: var(--display); font-size: 1.2rem; }
.spark { display: inline-flex; gap: 3px; align-items: flex-end; height: 22px; }
.spark i { width: 4px; background: var(--gold); }
select.btn { appearance: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.mobile-only { display: none; }
@media (max-width: 820px) { .mobile-only { display: block; margin-left: auto; } }

/* ---------- Accueil plein écran : les deux restaurants ---------- */
body[data-page="accueil"] main { max-width: none; padding: 0 !important; gap: 0; }
.split { display: grid; grid-template-columns: 1fr 1fr; height: calc(100dvh - 63px); min-height: 420px; }
@media (max-width: 820px) { .split { height: calc(100dvh - 63px - 66px - env(safe-area-inset-bottom)); } }
.half { border: 0; cursor: pointer; text-align: left; padding: clamp(20px, 4vw, 48px); display: flex; flex-direction: column; justify-content: space-between; transition: filter .3s; font: inherit; }
.half:hover { filter: brightness(.97); }
.half.s1 { background: var(--sage-1); color: var(--ink); }
.half.s2 { background: var(--sage-2); color: #f5f4ef; }
.half .k { font-size: .7rem; letter-spacing: .28em; text-transform: uppercase; }
.half b { font-family: var(--display); font-weight: 400; font-size: clamp(2.6rem, 9vw, 7rem); line-height: 1; display: block; }
.half .sub { font-family: var(--display); font-style: normal; font-size: clamp(1rem, 2.4vw, 1.4rem); opacity: .8; margin-top: 12px; display: block; }
.half[aria-current="true"] .k::after { content: " · votre maison"; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Accueil : vigne poudrée ---------- */

  const HE3 = {"Raisins noirs + peaux pendant la fermentation = couleur et tanins.": "ענבים שחורים + קליפות במהלך התסיסה = צבע וטאנינים.", "Les vendanges": "הבציר", "Les raisins noirs sont cueillis à maturité, à la main ou à la machine.": "הענבים השחורים נקטפים כשהם בשלים, ביד או במכונה.", "Égrappage et foulage": "הסרת עוקצים וריסוק", "On sépare les grains de la rafle (la partie en bois de la grappe), puis on éclate légèrement les grains pour libérer le jus.": "מפרידים את הגרגרים מהשדרה (החלק העצי של האשכול), ואז מועכים קלות את הגרגרים כדי לשחרר את המיץ.", "Le jus d'un raisin noir est presque toujours blanc. Toute la couleur est dans la peau. Le jus reste donc avec les peaux plusieurs jours ou semaines.": "המיץ של ענב שחור כמעט תמיד לבן. כל הצבע נמצא בקליפה. לכן המיץ נשאר עם הקליפות כמה ימים או שבועות.", "Plus la macération est longue, plus le vin est coloré et tannique.": "ככל שההשריה ארוכה יותר, היין צבעוני וטאני יותר.", "Fermentation alcoolique": "תסיסה אלכוהולית", "Pendant la macération, les levures mangent le sucre du raisin et le transforment en alcool. Elles libèrent aussi du gaz carbonique, qui fait bouillonner la cuve.": "במהלך ההשריה, השמרים אוכלים את הסוכר של הענבים והופכים אותו לאלכוהול. הם משחררים גם פחמן דו-חמצני, שגורם למיכל לבעבע.", "Sucre + levures = alcool + gaz carbonique.": "סוכר + שמרים = אלכוהול + פחמן דו-חמצני.", "Le vin repose de quelques mois à plusieurs années, en cuve, en fût de chêne ou en jarre. En fût, il gagne des arômes (vanille, toast, épices) et s'assouplit grâce à une oxygénation très lente.": "היין נח מכמה חודשים ועד כמה שנים, במיכל, בחבית עץ אלון או בכד. בחבית הוא מקבל ארומות (וניל, קלייה, תבלינים) ומתרכך בזכות חמצון איטי מאוד.", "Le bois est une épice : il doit accompagner le vin, pas le masquer.": "העץ הוא תבלין: הוא צריך ללוות את היין, לא להסתיר אותו.", "N'a pas lieu pour un vin fait d'un seul cépage (monocépage). On mélange plusieurs cuves ou plusieurs cépages pour trouver l'équilibre. Par exemple, à Bordeaux, on assemble souvent Merlot et Cabernet Sauvignon.": "לא קורה ביין שעשוי מזן אחד בלבד (זן יחיד). מערבבים כמה מיכלים או כמה זנים כדי למצוא את האיזון. למשל, בבורדו מערבבים הרבה פעמים מרלו וקברנה סוביניון.", "L'assemblage, c'est comme un chef qui crée une recette.": "הבלנד הוא כמו שף שיוצר מתכון.", "Mise en bouteille": "ביקבוק", "Le vin est mis en bouteille. Certains peuvent alors continuer d'évoluer pendant des années en cave.": "היין מבוקבק. חלק מהיינות יכולים אז להמשיך להתפתח במשך שנים במרתף.", "Un vin de garde gagne en complexité avec le temps.": "יין ליישון משתבח ונעשה מורכב יותר עם הזמן.", "On presse tout de suite : le jus fermente sans les peaux.": "סוחטים מיד: המיץ תוסס בלי הקליפות.", "Les raisins (souvent blancs, mais parfois noirs !) sont cueillis, souvent tôt le matin quand il fait frais, pour préserver les arômes.": "הענבים (לרוב לבנים, אבל לפעמים שחורים!) נקטפים, הרבה פעמים מוקדם בבוקר כשקריר, כדי לשמור על הארומות.", "On peut faire du vin blanc avec des raisins noirs, car leur jus est blanc.": "אפשר לעשות יין לבן מענבים שחורים, כי המיץ שלהם לבן.", "Pressurage direct": "סחיטה ישירה", "Les raisins vont immédiatement au pressoir. On récupère le jus et on laisse les peaux de côté.": "הענבים הולכים ישר לסחיטה. אוספים את המיץ ומשאירים את הקליפות בצד.", "Pas de peaux = pas de tanins et peu de couleur.": "בלי קליפות = בלי טאנינים ומעט צבע.", "Débourbage": "Débourbage (שיקוע המיץ)", "On laisse le jus reposer au frais quelques heures : les particules (les bourbes) tombent au fond. On récupère le jus clair au-dessus.": "משאירים את המיץ לנוח בקור כמה שעות: החלקיקים שוקעים לתחתית. אוספים את המיץ הצלול שלמעלה.", "Un jus plus propre donne un vin plus net et plus aromatique.": "מיץ נקי יותר נותן יין נקי וארומטי יותר.", "Les levures transforment le sucre en alcool, souvent à basse température (16 à 20 °C), pour garder les arômes fruités et floraux.": "השמרים הופכים את הסוכר לאלכוהול, הרבה פעמים בטמפרטורה נמוכה (16 עד 20 מעלות), כדי לשמור על הארומות הפירותיות והפרחוניות.", "Fermentation fraîche = arômes préservés.": "תסיסה קרה = ארומות שנשמרות.", "Malolactique : oui ou non ?": "תסיסה מלו-לקטית: כן או לא?", "Pour un blanc vif (Muscadet, Sancerre), on évite souvent la malolactique pour garder l'acidité. Pour un blanc riche (Meursault), on la fait : il devient plus rond et prend des notes beurrées.": "ללבן חד (מוסקדה, סנסר) הרבה פעמים נמנעים מהתסיסה המלו-לקטית כדי לשמור על החומציות. ללבן עשיר (מרסו) עושים אותה: הוא נעשה עגול יותר ומקבל נגיעות של חמאה.", "C'est un choix de style du vigneron.": "זו בחירת סגנון של הכורם.", "Élevage sur lies": "יישון על השמרים", "Le vin repose sur ses lies (levures mortes), en cuve ou en fût. On peut les remuer : c'est le bâtonnage, qui donne du gras et une texture crémeuse.": "היין נח על השמרים שלו (שמרים מתים), במיכל או בחבית. אפשר לערבב אותם: זה ה-Bâtonnage (ערבוב השמרים ביין), שנותן מלאות ומרקם קרמי.", "Cuve inox = fruit et fraîcheur. Fût = rondeur et notes grillées.": "מיכל נירוסטה = פרי ורעננות. חבית = עגלגלות ונגיעות קלויות.", "Le vin est stabilisé, filtré et mis en bouteille. La plupart des blancs se boivent jeunes, les grands blancs peuvent vieillir 10 ans et plus.": "היין מיוצב, מסונן ומבוקבק. רוב הלבנים שותים צעירים, הלבנים הגדולים יכולים להתיישן 10 שנים ויותר.", "Les cristaux blancs parfois trouvés au fond sont du tartre, sans danger.": "הגבישים הלבנים שמוצאים לפעמים בתחתית הם אבנית יין (גבישי חומצה טרטרית), לא מסוכנים.", "Raisins noirs + peaux pendant quelques heures seulement.": "ענבים שחורים + קליפות לכמה שעות בלבד.", "On cueille des raisins noirs (Grenache, Cinsault, Syrah…), souvent la nuit ou tôt le matin pour qu'ils restent frais.": "קוטפים ענבים שחורים (גרנאש, סנסו, סירה…), הרבה פעמים בלילה או מוקדם בבוקר כדי שיישארו קרירים.", "En France, on n'a pas le droit de mélanger du vin rouge et du vin blanc pour faire un rosé tranquille.": "בצרפת אסור לערבב יין אדום ויין לבן כדי לעשות רוזה שקט (בלי בועות).", "Macération courte ou pressurage direct": "השריה קצרה או סחיטה ישירה", "Le jus reste en contact avec les peaux de quelques heures à une nuit seulement, juste le temps de prendre une teinte rose. Pour les rosés très pâles, on presse directement.": "המיץ נשאר במגע עם הקליפות מכמה שעות ועד לילה אחד בלבד, בדיוק כדי לקבל גוון ורוד. לרוזה בהיר מאוד סוחטים ישר.", "Quelques heures de peaux = rose pâle. Une nuit = rose plus soutenu.": "כמה שעות עם הקליפות = ורוד בהיר. לילה = ורוד עמוק יותר.", "Pressurage": "סחיטה", "Le jus rose est séparé des peaux. À partir de là, on travaille comme pour un vin blanc.": "מפרידים את המיץ הוורוד מהקליפות. מכאן עובדים כמו ביין לבן.", "Le rosé, c'est un rouge qui s'arrête très tôt, puis devient un blanc.": "הרוזה הוא אדום שעוצר מוקדם מאוד, ואז הופך ללבן.", "Fermentation à basse température": "תסיסה בטמפרטורה נמוכה", "Fermentation au frais pour garder les arômes de petits fruits rouges, de pêche et d'agrumes.": "תסיסה בקור כדי לשמור על ארומות של פירות אדומים קטנים, אפרסק והדרים.", "La couleur pâle n'a rien à voir avec le sucre.": "לצבע הבהיר אין שום קשר לסוכר.", "Mise en bouteille rapide": "ביקבוק מהיר", "La plupart des rosés sont mis en bouteille au printemps qui suit les vendanges, pour être bus jeunes et frais.": "רוב הרוזה מבוקבקים באביב שאחרי הבציר, כדי לשתות אותם צעירים ורעננים.", "Un rosé se boit en général dans l'année ou les deux ans.": "רוזה שותים בדרך כלל בתוך שנה או שנתיים.", "Raisins blancs vinifiés comme un rouge, avec leurs peaux.": "ענבים לבנים שמיוצרים כמו יין אדום, עם הקליפות.", "On cueille des raisins blancs bien mûrs. Les peaux doivent être saines, car elles vont rester longtemps avec le jus.": "קוטפים ענבים לבנים בשלים היטב. הקליפות צריכות להיות בריאות, כי הן יישארו הרבה זמן עם המיץ.", "Vin orange = raisins blancs. Aucune orange dedans !": "יין כתום = ענבים לבנים. אין בו תפוזים!", "Égrappage (ou grappes entières)": "הסרת עוקצים (או אשכולות שלמים)", "Selon le vigneron, on enlève les rafles ou on les garde. En Géorgie, la tradition garde souvent tout : peaux, pépins et rafles.": "תלוי בכורם: מסירים את השדרות או משאירים אותן. בגאורגיה המסורת משאירה הרבה פעמים הכול: קליפות, חרצנים ושדרות.", "Les rafles ajoutent de la structure et une légère amertume.": "השדרות מוסיפות מבנה ומרירות קלה.", "Macération longue avec les peaux": "השריה ארוכה עם הקליפות", "Le jus des raisins blancs fermente avec les peaux pendant des jours, des semaines, voire des mois. Les peaux donnent la couleur ambrée, des tanins et des arômes d'abricot sec, de thé, d'écorce d'agrume.": "המיץ של הענבים הלבנים תוסס עם הקליפות ימים, שבועות ואפילו חודשים. הקליפות נותנות צבע ענברי, טאנינים וארומות של משמש מיובש, תה וקליפת הדרים.", "C'est la technique du vin rouge appliquée au raisin blanc.": "זו הטכניקה של יין אדום, על ענב לבן.", "La qvevri géorgienne": "ה-Qvevri הגאורגי (כד חרס גדול)", "Le berceau de ce style est la Géorgie, où l'on vinifie depuis environ 8 000 ans dans des qvevri : de grandes jarres en terre cuite enterrées, qui gardent une température stable.": "ערש הסגנון הזה הוא גאורגיה, שבה מייצרים יין כבר כ-8,000 שנה ב-Qvevri: כדי חרס גדולים שקבורים באדמה ושומרים על טמפרטורה יציבה.", "La Géorgie est considérée comme l'un des berceaux du vin.": "גאורגיה נחשבת לאחד ממקומות הולדתו של היין.", "Pressurage et élevage": "סחיטה ויישון", "On sépare le vin des peaux, puis il est élevé en jarre, en cuve ou en vieux fût.": "מפרידים את היין מהקליפות, ואז הוא מתיישן בכד, במיכל או בחבית ישנה.", "Résultat : un vin sec, ambré, avec une texture qui accroche un peu, comme un thé.": "התוצאה: יין יבש, ענברי, עם מרקם שקצת \"תופס\", כמו תה.", "Souvent peu ou pas filtré : un léger trouble est normal. Il se sert entre 12 et 14 °C, pas trop froid, pour sentir ses arômes.": "הרבה פעמים מסונן מעט או בכלל לא: עכירות קלה היא נורמלית. מגישים אותו בין 12 ל-14 מעלות, לא קר מדי, כדי להרגיש את הארומות.", "Le vin orange s'accorde très bien avec la cuisine épicée.": "יין כתום מתאים מאוד לאוכל מתובל.", "Un vin blanc tranquille, puis une seconde fermentation en bouteille.": "יין לבן שקט, ואחר כך תסיסה שנייה בבקבוק.", "Vendanges manuelles": "בציר ידני", "En Champagne, les vendanges sont obligatoirement manuelles, en grappes entières. Les trois grands cépages : Chardonnay (blanc), Pinot noir et Meunier (noirs).": "בשמפאן הבציר חייב להיות ידני, באשכולות שלמים. שלושת הזנים הגדולים: שרדונה (לבן), פינו נואר ומונייה (שחורים).", "Les raisins noirs sont pressés doucement pour garder un jus blanc.": "הענבים השחורים נסחטים בעדינות כדי לשמור על מיץ לבן.", "Pressurage doux": "סחיטה עדינה", "On presse lentement les grappes entières. On sépare la « cuvée » (le premier jus, le plus fin) de la « taille » (la suite).": "סוחטים לאט את האשכולות השלמים. מפרידים את ה-«Cuvée» (המיץ הראשון, העדין ביותר) מה-«Taille» (ההמשך).", "Blanc de blancs = 100 % raisins blancs. Blanc de noirs = 100 % raisins noirs.": "Blanc de blancs = 100% ענבים לבנים. Blanc de noirs = 100% ענבים שחורים.", "Première fermentation": "תסיסה ראשונה", "Le jus fermente en cuve comme un vin blanc : on obtient un vin tranquille, très acide, appelé « vin clair ».": "המיץ תוסס במיכל כמו יין לבן: מקבלים יין שקט, חומצי מאוד, שנקרא «Vin clair» (יין הבסיס).", "À ce stade, il n'y a pas encore de bulles.": "בשלב הזה עוד אין בועות.", "Le chef de cave assemble des vins de différents villages, cépages et années (vins de réserve) pour créer le style de la maison.": "ה-Chef de cave (האחראי על הייננות בבית) מערבב יינות מכפרים, זנים ושנים שונים (יינות רזרבה) כדי ליצור את הסגנון של הבית.", "Un Champagne « sans année » assemble plusieurs récoltes. Un millésimé vient d'une seule année.": "שמפניה «ללא שנת בציר» מערבבת כמה בצירים. שמפניה מיושנת (Millésimé) מגיעה משנה אחת.", "Tirage et prise de mousse": "Tirage ו-Prise de mousse (ביקבוק ויצירת הבועות)", "On met le vin en bouteille avec un peu de sucre et de levures (la liqueur de tirage), puis on ferme avec une capsule. Une seconde fermentation se produit dans la bouteille. Le gaz ne peut pas s'échapper : il se dissout dans le vin. Ce sont les futures bulles !": "מבקבקים את היין עם קצת סוכר ושמרים (ה-Liqueur de tirage), ואז סוגרים בפקק כתר. תסיסה שנייה מתרחשת בבקבוק. הגז לא יכול לברוח: הוא מתמוסס ביין. אלה הבועות העתידיות!", "La bulle du Champagne naît dans la bouteille.": "הבועה של השמפניה נולדת בבקבוק.", "Vieillissement sur lattes": "יישון Sur lattes (בבקבוקים שוכבים)", "Les bouteilles vieillissent couchées en cave, au contact des levures mortes : au moins 15 mois pour un sans année, 3 ans pour un millésimé.": "הבקבוקים מתיישנים שוכבים במרתף, במגע עם השמרים המתים: לפחות 15 חודשים לשמפניה ללא שנת בציר, 3 שנים למיושנת.", "C'est ce contact qui donne les arômes de brioche et de pain grillé.": "המגע הזה הוא שנותן את הארומות של בריוש ולחם קלוי.", "Les bouteilles sont placées tête en bas, sur des pupitres ou des machines (gyropalettes). On les tourne et on les incline petit à petit pour faire descendre le dépôt de levures dans le goulot.": "מניחים את הבקבוקים עם הראש למטה, על Pupitres (מדפי עץ) או במכונות (Gyropalettes). מסובבים ומטים אותם לאט לאט כדי להוריד את משקע השמרים לצוואר הבקבוק.", "Le dépôt doit finir collé contre la capsule.": "המשקע צריך להגיע עד הפקק.", "On plonge le goulot dans un bain glacé : le dépôt est pris dans un petit glaçon. On ouvre la bouteille, la pression éjecte le glaçon. Le vin est maintenant limpide.": "טובלים את צוואר הבקבוק באמבט קפוא: המשקע נלכד בקוביית קרח קטנה. פותחים את הבקבוק, והלחץ מעיף את הקרח. עכשיו היין צלול.", "Sur certaines étiquettes, on trouve la date de dégorgement.": "על חלק מהתוויות מופיע תאריך ה-Dégorgement (הוצאת המשקע).", "Dosage et bouchage": "Dosage (תוספת הסוכר) וסגירה בפקק", "On complète avec la liqueur d'expédition, un mélange de vin et de sucre. Sa quantité définit le style : brut nature, extra brut, brut, extra dry, sec, demi-sec, doux. Puis bouchon en liège et muselet.": "משלימים עם ה-Liqueur d'expédition, תערובת של יין וסוכר. הכמות שלה קובעת את הסגנון: brut nature, extra brut, brut, extra dry, sec, demi-sec, doux. ואז פקק שעם ו-Muselet (כלוב תיל שמחזיק את הפקק).", "« Brut » = moins de 12 g de sucre par litre.": "«Brut» = פחות מ-12 גרם סוכר לליטר.", "Garder le sucre du raisin : par concentration ou par mutage.": "לשמור את הסוכר של הענבים: על ידי ריכוז או על ידי Mutage (עצירת התסיסה באלכוהול).", "Concentrer le sucre dans le raisin": "לרכז את הסוכר בענב", "Pour un liquoreux (Sauternes, Coteaux du Layon), on attend la pourriture noble : un champignon, le Botrytis cinerea, perce la peau, l'eau s'évapore, le sucre se concentre. D'autres vins doux viennent de raisins séchés au soleil (passerillage).": "ליין קינוח (סוטרן, קוטו דו לאיון) מחכים לעובש האציל: פטרייה, Botrytis cinerea, שחודרת לקליפה, המים מתאדים והסוכר מתרכז. יינות מתוקים אחרים מגיעים מענבים מיובשים בשמש (Passerillage).", "Moins d'eau dans le raisin = plus de sucre dans le jus.": "פחות מים בענב = יותר סוכר במיץ.", "Vendanges par tries successives": "בציר בכמה סבבים", "Pour les liquoreux, les vendangeurs passent plusieurs fois dans la vigne et ne cueillent que les grains prêts. C'est long et coûteux.": "ליינות קינוח הבוצרים עוברים כמה פעמים בכרם וקוטפים רק את הגרגרים המוכנים. זה ארוך ויקר.", "Un pied de vigne à Sauternes peut ne donner qu'un verre de vin.": "גפן אחת בסוטרן יכולה לתת רק כוס יין אחת.", "Les raisins très concentrés donnent peu de jus, épais et très sucré.": "הענבים המרוכזים מאוד נותנים מעט מיץ, סמיך ומתוק מאוד.", "Le rendement est très faible.": "היבול נמוך מאוד.", "Fermentation qui s'arrête": "תסיסה שנעצרת", "Les levures transforment une partie du sucre en alcool. Quand il y a trop de sucre et d'alcool, elles s'arrêtent : le reste du sucre reste dans le vin.": "השמרים הופכים חלק מהסוכר לאלכוהול. כשיש יותר מדי סוכר ואלכוהול, הם עוצרים: שאר הסוכר נשאר ביין.", "Un liquoreux, c'est un vin où les levures n'ont pas tout mangé.": "יין קינוח הוא יין שבו השמרים לא אכלו הכול.", "L'autre méthode : le mutage": "השיטה האחרת: Mutage", "Pour les vins doux naturels (Banyuls, Maury, Muscat de Beaumes-de-Venise), on ajoute de l'alcool neutre pendant la fermentation. Les levures s'arrêtent net, le sucre reste. Le Porto se fait de la même façon.": "ב-Vins doux naturels (יינות מתוקים טבעיים: בניולס, מורי, מוסקט דה בום-דה-וניז) מוסיפים אלכוהול ניטרלי במהלך התסיסה. השמרים עוצרים מיד, והסוכר נשאר. הפורט נעשה באותה דרך.", "Mutage = on arrête la fermentation avec de l'alcool.": "Mutage = עוצרים את התסיסה עם אלכוהול.", "Les liquoreux sont souvent élevés en fût. Certains vins doux naturels vieillissent volontairement à l'air, même au soleil, pour prendre des notes de cacao et de fruits secs.": "יינות קינוח מתיישנים הרבה פעמים בחבית. חלק מה-Vins doux naturels מתיישנים בכוונה באוויר, ואפילו בשמש, כדי לקבל נגיעות של קקאו ופירות יבשים.", "Ces vins se gardent très longtemps.": "את היינות האלה אפשר לשמור הרבה מאוד זמן.", "Souvent en demi-bouteille (37,5 cl), car on en sert de petites quantités.": "הרבה פעמים בחצי בקבוק (375 מ\"ל), כי מגישים מהם כמויות קטנות.", "Servir 6 à 8 cl par verre.": "מגישים 6 עד 8 ס\"ל לכוס.", "Je cueille les raisins !": "אני קוטפת את הענבים!", "Je mets les raisins dans la cuve, avec leurs peaux.": "אני שמה את הענבים במיכל, עם הקליפות.", "Je fais fermenter le jus avec les peaux.": "אני נותנת למיץ לתסוס עם הקליפות.", "Après la fermentation, je presse les raisins avec leurs peaux.": "אחרי התסיסה, אני סוחטת את הענבים עם הקליפות.", "Je mets le vin en bouteille.": "אני מבקבקת את היין.", "Je presse les raisins tout de suite.": "אני סוחטת את הענבים מיד.", "Je verse le jus, sans les peaux, dans la cuve.": "אני שופכת את המיץ, בלי הקליפות, למיכל.", "Je fais fermenter le jus.": "אני נותנת למיץ לתסוס.", "Je cueille des raisins noirs !": "אני קוטפת ענבים שחורים!", "Je laisse les peaux colorer le jus quelques heures.": "אני נותנת לקליפות לצבוע את המיץ כמה שעות.", "Je presse : le jus rose coule.": "אני סוחטת: המיץ הוורוד זורם.", "Je fais fermenter le jus rose.": "אני נותנת למיץ הוורוד לתסוס.", "Je mets le rosé en bouteille.": "אני מבקבקת את הרוזה.", "Je cueille des raisins blancs !": "אני קוטפת ענבים לבנים!", "Je mets les raisins blancs dans la cuve, avec leurs peaux.": "אני שמה את הענבים הלבנים במיכל, עם הקליפות.", "Je fais fermenter avec les peaux, pendant des semaines.": "אני נותנת לתסוס עם הקליפות, במשך שבועות.", "Je presse les peaux : le vin ambré coule.": "אני סוחטת את הקליפות: היין הענברי זורם.", "Je presse les raisins.": "אני סוחטת את הענבים.", "Première fermentation dans la cuve.": "תסיסה ראשונה במיכל.", "Je ferme la cuve : la deuxième fermentation fait les bulles !": "אני סוגרת את המיכל: התסיסה השנייה יוצרת את הבועות!", "Je mets les bulles en bouteille.": "אני מבקבקת את הבועות.", "Je cueille les raisins à la main !": "אני קוטפת את הענבים ביד!", "Je presse tout doucement.": "אני סוחטת בעדינות רבה.", "En bouteille, avec du sucre et des levures.": "בבקבוק, עם סוכר ושמרים.", "Deuxième fermentation dans la bouteille : les bulles !": "תסיסה שנייה בבקבוק: הבועות!", "Je tourne les bouteilles, tête en bas.": "אני מסובבת את הבקבוקים, ראש למטה.", "J'enlève le dépôt : pschitt !": "אני מוציאה את המשקע: פשש!", "J'ajoute le dosage et le bouchon.": "אני מוסיפה את הדוסאז' ואת הפקק.", "Je le fais vieillir ?": "ליישן אותו?", " · Vieillir ou pas ?": " · ליישן או לא?", "Parfait, bien rond !": "מושלם, עגול יפה!", "On le boit jeune !": "שותים אותו צעיר!", "Le vigneron cueille les grappes de raisins noirs bien mûres.": "הכורמת קוטפת את אשכולות הענבים השחורים הבשלים.", "Dans la cuve": "במיכל", "Il enlève les tiges, écrase un peu les raisins et met tout dans la cuve : le jus, les peaux et les pépins.": "היא מסירה את העוקצים, מועכת קצת את הענבים ושמה הכול במיכל: המיץ, הקליפות והחרצנים.", "La fermentation avec les peaux": "התסיסה עם הקליפות", "Les levures transforment le sucre en alcool. Les peaux donnent au vin sa couleur et ses tanins. Elles remontent en « chapeau » : il les enfonce pour bien mélanger.": "השמרים הופכים את הסוכר לאלכוהול. הקליפות נותנות ליין את הצבע ואת הטאנינים. הן עולות למעלה ויוצרות «כובע»: היא דוחפת אותן למטה כדי לערבב היטב.", "Le pressoir, après la fermentation": "הסחיטה, אחרי התסיסה", "Seulement maintenant, il sort les peaux de la cuve et les presse : le vin coule dans le seau.": "רק עכשיו היא מוציאה את הקליפות מהמיכל וסוחטת אותן: היין זורם לדלי.", "En fût de chêne, pour le faire vieillir": "בחבית עץ אלון, כדי ליישן אותו", "En cuve, pour le garder jeune": "במיכל, כדי לשמור אותו צעיר", "Il le met en fût de chêne : le vin s'assouplit et prend des notes de vanille et de pain grillé.": "היא שמה אותו בחבית עץ אלון: היין מתרכך ומקבל נגיעות של וניל ולחם קלוי.", "Il le remet dans la cuve propre : un vin fruité et frais, à boire jeune.": "היא מחזירה אותו למיכל הנקי: יין פירותי ורענן, לשתייה צעיר.", "Il remplit la bouteille, met le bouchon et colle l'étiquette.": "היא ממלאת את הבקבוק, סוגרת בפקק ומדביקה את התווית.", "Le vigneron cueille les grappes de raisins blancs bien mûres.": "הכורמת קוטפת את אשכולות הענבים הלבנים הבשלים.", "Le pressoir tout de suite": "הסחיטה מיד", "Il presse les raisins dès la cueillette : le jus coule dans le seau, les peaux restent dans le pressoir.": "היא סוחטת את הענבים מיד אחרי הקטיף: המיץ זורם לדלי, הקליפות נשארות במסחטה.", "Dans la cuve, sans les peaux": "במיכל, בלי הקליפות", "Il verse le jus clair dans une cuve propre. Les peaux ne vont pas dans la cuve : pas de couleur, pas de tanins.": "היא שופכת את המיץ הצלול למיכל נקי. הקליפות לא נכנסות למיכל: אין צבע, אין טאנינים.", "Les levures transforment le sucre en alcool : le jus devient du vin blanc, frais et sans tanins.": "השמרים הופכים את הסוכר לאלכוהול: המיץ נהיה יין לבן, רענן ובלי טאנינים.", "Il le met en fût : le blanc devient plus rond, avec des notes de noisette, de beurre et de vanille.": "היא שמה אותו בחבית: הלבן נעשה עגול יותר, עם נגיעות של אגוז לוז, חמאה ווניל.", "Il le garde en cuve : un blanc vif et fruité, à boire jeune.": "היא שומרת אותו במיכל: לבן חד ופירותי, לשתייה צעיר.", "Le vigneron cueille des raisins noirs : le rosé se fait avec des raisins noirs, comme le rouge.": "הכורמת קוטפת ענבים שחורים: רוזה עושים מענבים שחורים, כמו אדום.", "Il met les raisins écrasés dans la cuve, avec leurs peaux.": "היא שמה את הענבים המעוכים במיכל, עם הקליפות.", "Juste quelques heures": "רק כמה שעות", "Les peaux colorent le jus, mais seulement quelques heures : juste assez pour qu'il devienne rose. (En Provence, on presse souvent tout de suite, pour un rosé très pâle.)": "הקליפות צובעות את המיץ, אבל רק כמה שעות: בדיוק מספיק כדי שיהיה ורוד. (בפרובאנס הרבה פעמים סוחטים מיד, לרוזה בהיר מאוד.)", "Stop, il est rose !": "סטופ, הוא ורוד!", "Il sort les raisins et les presse : le jus rose coule dans le seau, sans les peaux.": "היא מוציאה את הענבים וסוחטת אותם: המיץ הוורוד זורם לדלי, בלי הקליפות.", "Il remet le jus rose dans la cuve propre. Les levures transforment le sucre en alcool, au frais, pour garder les arômes de petits fruits.": "היא מחזירה את המיץ הוורוד למיכל הנקי. השמרים הופכים את הסוכר לאלכוהול, בקור, כדי לשמור על ארומות של פירות קטנים.", "Pas besoin de vieillir : il le met vite en bouteille, pour le boire jeune et frais.": "אין צורך ביישון: היא מבקבקת אותו מהר, כדי לשתות אותו צעיר ורענן.", "Le vigneron cueille des raisins blancs : un vin orange, c'est du raisin blanc, pas des oranges !": "הכורמת קוטפת ענבים לבנים: יין כתום עשוי מענבים לבנים, לא מתפוזים!", "Dans la cuve, avec les peaux": "במיכל, עם הקליפות", "Il fait comme pour un rouge : les raisins blancs écrasés vont dans la cuve avec leurs peaux.": "היא עושה כמו ביין אדום: הענבים הלבנים המעוכים נכנסים למיכל עם הקליפות.", "Fermenter avec les peaux": "תסיסה עם הקליפות", "Le jus fermente avec les peaux pendant des jours, parfois des mois (en Géorgie, dans de grandes jarres en terre). Les peaux lui donnent sa couleur ambrée et un peu de tanin.": "המיץ תוסס עם הקליפות במשך ימים, לפעמים חודשים (בגאורגיה, בכדי חרס גדולים). הקליפות נותנות לו את הצבע הענברי וקצת טאנינים.", "Il sort les peaux et les presse : le vin ambré coule dans le seau.": "היא מוציאה את הקליפות וסוחטת אותן: היין הענברי זורם לדלי.", "En vieux fût, pour le faire vieillir": "בחבית ישנה, כדי ליישן אותו", "Il le met en vieux fût : le vin s'arrondit sans prendre trop le goût du bois.": "היא שמה אותו בחבית ישנה: היין מתעגל בלי לקבל יותר מדי טעם של עץ.", "Il le remet en cuve : un vin orange plus vif et fruité.": "היא מחזירה אותו למיכל: יין כתום חד ופירותי יותר.", "Il remplit la bouteille, souvent sans filtrer : un léger trouble est normal.": "היא ממלאת את הבקבוק, הרבה פעמים בלי סינון: עכירות קלה היא נורמלית.", "Le vigneron cueille les raisins. Pour le prosecco, c'est surtout la glera, un raisin blanc.": "הכורמת קוטפת את הענבים. לפרוסקו זה בעיקר גלרה, ענב לבן.", "Il presse tout de suite : le jus coule dans le seau, les peaux restent dans le pressoir.": "היא סוחטת מיד: המיץ זורם לדלי, הקליפות נשארות במסחטה.", "Le jus fermente en cuve, comme un vin blanc : on obtient un vin tranquille, sans bulles.": "המיץ תוסס במיכל, כמו יין לבן: מקבלים יין שקט, בלי בועות.", "La 2e fermentation en cuve fermée": "התסיסה השנייה במיכל סגור", "Il ajoute du sucre et des levures, puis ferme la cuve. Le gaz de la 2e fermentation ne peut pas sortir : il reste dans le vin et fait les bulles. C'est la méthode du prosecco. (Le crémant et le cava, eux, se font comme le champagne, en bouteille.)": "היא מוסיפה סוכר ושמרים, ואז סוגרת את המיכל. הגז של התסיסה השנייה לא יכול לצאת: הוא נשאר ביין ויוצר את הבועות. זו השיטה של הפרוסקו. (הקרמן והקאווה נעשים כמו שמפניה, בבקבוק.)", "Il met le vin en bouteille sous pression, pour garder les bulles, puis un bouchon en champignon et son muselet.": "היא מבקבקת את היין בלחץ, כדי לשמור על הבועות, ואז פקק פטרייה ו-Muselet (כלוב תיל שמחזיק את הפקק).", "Vendanges à la main, en grappes entières : raisins noirs (pinot noir, meunier) et blancs (chardonnay).": "בציר ידני, באשכולות שלמים: ענבים שחורים (פינו נואר, מונייה) ולבנים (שרדונה).", "Il presse tout de suite, très doucement : même avec des raisins noirs, le jus reste blanc.": "היא סוחטת מיד, בעדינות רבה: גם עם ענבים שחורים, המיץ נשאר לבן.", "Le jus fermente en cuve, comme un vin blanc : on obtient un vin tranquille, encore sans bulles.": "המיץ תוסס במיכל, כמו יין לבן: מקבלים יין שקט, עדיין בלי בועות.", "Il met ce vin en bouteille et ajoute un peu de sucre et de levures (la liqueur de tirage), puis une capsule.": "היא מבקבקת את היין ומוסיפה קצת סוכר ושמרים (ה-Liqueur de tirage), ואז פקק כתר.", "La 2e fermentation, dans la bouteille": "התסיסה השנייה, בבקבוק", "Les levures mangent le sucre dans la bouteille fermée. Le gaz ne peut pas sortir : il se dissout dans le vin. Ce sont les bulles ! Les bouteilles vieillissent ensuite sur les levures (au moins 15 mois).": "השמרים אוכלים את הסוכר בבקבוק הסגור. הגז לא יכול לצאת: הוא מתמוסס ביין. אלה הבועות! אחר כך הבקבוקים מתיישנים על השמרים (לפחות 15 חודשים).", "Des bulles !": "בועות!", "Les levures mortes font un petit dépôt. On penche la bouteille tête en bas, petit à petit, en la tournant : le dépôt descend jusqu'au goulot.": "השמרים המתים יוצרים משקע קטן. מטים את הבקבוק עם הראש למטה, לאט לאט, תוך כדי סיבוב: המשקע יורד עד צוואר הבקבוק.", "Le goulot passe dans un bain glacé : le dépôt est pris dans un petit glaçon. On ouvre la capsule et la pression chasse le glaçon. Le vin est limpide.": "צוואר הבקבוק עובר באמבט קפוא: המשקע נלכד בקוביית קרח קטנה. פותחים את פקק הכתר והלחץ מעיף את הקרח. היין צלול.", "Dosage et bouchon": "Dosage (תוספת הסוכר) ופקק", "Il complète avec un peu de vin et de sucre (le dosage : brut, extra brut…), puis met le bouchon en champignon et son muselet.": "היא משלימה עם קצת יין וסוכר (ה-Dosage: brut, extra brut…), ואז שמה פקק פטרייה ו-Muselet (כלוב תיל).", "Rejouer": "שוב", "La mise en bouteille": "הביקבוק", "Merci, au revoir !": "תודה, להתראות!", "Vieillir ou pas ?": "ליישן או לא?", "Le remuage": "ה-Remuage (סיבוב הבקבוקים)", "Le dégorgement": "ה-Dégorgement (הוצאת המשקע)", "Le pressoir": "הסחיטה", "La fermentation": "התסיסה"};

ine de Sulauze – היינות שלנו", "Un Gran Reserva de Rioja élevé plus de cinq ans entre fût et bouteille : tabac, cèdre et cacao.": "Gran Reserva (רמת היישון הגבוהה ביותר בספרד) מריוחה, שהתיישן יותר מחמש שנים בין חבית לבקבוק: טבק, ארז וקקאו.", "Macération à froid avant la fermentation, puis fermentation à 26–28 °C avec remontages réguliers.": "השריה בקור לפני התסיסה, ואחר כך תסיסה ב-26–28 מעלות עם שאיבת היין מעל הקליפות באופן קבוע.", "28 mois en barriques de chêne français, puis au moins 36 mois en bouteille. Mise en bouteille en février 2022.": "28 חודשים בחביות אלון צרפתי, ואחר כך לפחות 36 חודשים בבקבוק. בוקבק בפברואר 2022.", "Sur l'étiquette : « Nacido entre amigos para ser disfrutado por amigos », né entre amis pour être bu entre amis. La bodega a été fondée à Ollauri en 1973.": "על התווית: «Nacido entre amigos para ser disfrutado por amigos», נולד בין חברים כדי שישתו אותו בין חברים. היקב נוסד באוז'אורי (Ollauri) ב-1973.", "15 à 17 °C": "15 עד 17 מעלות", "Jusqu'en 2037.": "עד 2037.", "Tempranillo 94 %, Graciano 6 %": "טמפרניו 94%, גרסיאנו 6%", "Grenat profond.": "אדום-גרנט עמוק.", "Fruits compotés, fruits secs, puis tabac de pipe et cèdre, avec des notes minérales et épicées.": "פירות מבושלים, פירות יבשים, ואחר כך טבק מקטרת וארז, עם נגיעות מינרליות ומתובלות.", "Équilibrée, le fruit au-dessus du cacao, tanins de grande qualité.": "מאוזן, הפרי מעל הקקאו, טאנינים באיכות גבוהה מאוד.", "tabac": "טבק", "cèdre": "ארז", "cacao": "קקאו", "Fiche technique González Byass – Beronia GR 2018": "דף טכני של González Byass – Beronia GR 2018", "Un Châteauneuf-du-Pape à dominante de Grenache, né sur les fameux galets roulés : généreux et puissant.": "Châteauneuf-du-Pape שהגרנאש שולט בו, שנולד על האבנים המעוגלות המפורסמות: נדיב ועוצמתי.", "Vinification traditionnelle en cuves béton, extraction douce et maîtrisée pour garder le fruit.": "ייצור מסורתי במיכלי בטון, מיצוי עדין ומבוקר כדי לשמור על הפרי.", "En cuves béton et en fûts.": "במיכלי בטון ובחביות.", "Le terroir mêle galets roulés re, issu d'un seul vignoble à Zichron-Yaakov.": "בלנד ים-תיכוני של סירה, גרנאש ומורבדר, מכרם אחד בזכרון יעקב.", "Margalit est une winery familiale fondée en 1989. Son vignoble de Zichron a été planté en 2011, au nord de la vallée de Hanadiv.": "מרגלית הוא יקב משפחתי שנוסד ב-1989. הכרם שלו בזכרון ניטע ב-2011, בצפון עמק הנדיב.", "Syrah 59 %, Grenache 32 %, Mourvèdre 9 %": "סירה 59%, גרנאש 32%, מורבדר 9%", "Zichron-Yaakov": "זכרון יעקב", "Zichron – Single Vineyard": "זכרון – כרם יחיד (Single Vineyard)", "Margalit Winery – Paradigma GSM": "יקב מרגלית – Paradigma GSM", "Méthode champenoise. Assemblage de 40 à 50 crus différents, venus de la Côte des Blancs et de la Montagne de Reims.": "השיטה השמפנית. בלנד של 40 עד 50 Crus (כפרים מדורגים) שונים, מ-Côte des Blancs ומ-Montagne de Reims.", "Ruinart, fondée en 1729, est la plus ancienne maison de Champagne (date inscrite sur l'étiquette).": "Ruinart, שנוסד ב-1729, הוא בית השמפניה הוותיק ביותר (התאריך כתוב על התווית).", "Pinot noir 40 à 45 %, chardonnay 40 %, meunier 10 à 15 %": "פינו נואר 40 עד 45%, שרדונה 40%, מונייה 10 עד 15%", "Champagne (Reims)": "שמפאן (ריימס)", "Sans année": "ללא שנת בציר", "Site officiel Ruinart": "האתר הרשמי של Ruinart", "Étiquette et carte de Trigger": "התווית והתפריט של Trigger", "Méthode champenoise. Rosé d'assemblage : la couleur vient d'un peu de pinot noir vinifié en vin rouge (12 %), ajouté au vin blanc. Environ 25 % de vins de réserve, raisins 100 % Premier Cru. Chardonnay de la Côte des Blancs et de la Montagne de Reims, pinot noir de la Montagne de Reims et de la Vallée de la Marne.": "השיטה השמפנית. רוזה של בלנד: הצבע מגיע מקצת פינו נואר שיוצר כיין אדום (12%) ונוסף ליין הלבן. כ-25% יינות רזרבה, ענבים 100% Premier Cru (דרגה שנייה בחשיבותה בשמפאן). שרדונה מ-Côte des Blancs ומ-Montagne de Reims, פינו נואר מ-Montagne de Reims ומ-Vallée de la Marne.", "Chardonnay 45 %, pinot noir 55 % (dont 12 % vinifié en vin rouge)": "שרדונה 45%, פינו נואר 55% (מתוכם 12% שיוצרו כיין אדום)", "Magazine Decanter (revue du vin anglaise)": "מגזין Decanter (כתב עת אנגלי ליין)", "Méthode champenoise. 100 % chardonnay, assemblage de 25 à 30 crus, surtout de la Côte des Blancs et de la Montagne de Reims, plus le Sézannais et la Vallée de la Vesle. Dosage : 7 g de sucre par litre (brut).": "השיטה השמפנית. 100% שרדונה, בלנד של 25 עד 30 Crus (כפרים מדורגים), בעיקר מ-Côte des Blancs ומ-Montagne de Reims, ועוד מ-Sézannais ומ-Vallée de la Vesle. Dosage (תוספת הסוכר בסוף): 7 גרם סוכר לליטר (brut).", "Le chardonnay est le cépage signature de la maison Ruinart.": "השרדונה הוא הזן המזוהה ביותר עם בית Ruinart.", "Blanc de blancs : uniquement des raisins blancs (chardonnay)": "Blanc de blancs (לבן מלבנים): רק ענבים לבנים (שרדונה)", "Méthode champenoise. Environ deux tiers de vin de la dernière vendange et un tiers de vins de réserve.": "השיטה השמפנית. בערך שני שלישים יין מהבציר האחרון ושליש יינות רזרבה.", "Les vins de réserve sont gardés en fûts de chêne selon une « réserve perpétuelle » : chaque année on ajoute le vin nouveau à ceux des années précédentes. Dosage : 8 g/L (brut).": "יינות הרזרבה נשמרים בחביות אלון לפי «רזרבה תמידית»: כל שנה מוסיפים את היין החדש ליינות של השנים הקודמות. Dosage (תוספת הסוכר בסוף): 8 גרם לליטר (brut).", "Maison dont les racines remontent à 1522 (date sur l'étiquette). La réserve perpétuelle existe depuis 1946. La cuvée s'appelait avant « Royale Réserve » : c'est le nom de notre carte.": "בית ששורשיו מגיעים עד 1522 (התאריך על התווית). הרזרבה התמידית קיימת מאז 1946. הקווה נקרא בעבר «Royale Réserve»: זה השם שמופיע בתפריט שלנו.", "À base de pinot noir": "על בסיס פינו נואר", "Champagne": "שמפאן", "Justerini & Brooks (importateur UK)": "Justerini & Brooks (יבואן בבריטניה)", "Méthode champenoise. Avec des vins de réserve de millésimes choisis, dont du pinot noir et du chardonnay Grands Crus.": "השיטה השמפנית. עם יינות רזרבה משנות בציר נבחרות, ביניהם פינו נואר ושרדונה Grands Crus (הדרגה הגבוהה ביותר בשמפאן).", "3 ans de vieillissement sur lies dans les caves de la maison avant la vente.": "3 שנות יישון על השמרים במרתפים של הבית לפני המכירה.", "Maison fondée en 1838 à Aÿ (étiquette). C'est la première cuvée élaborée chaque année par la maison.": "בית שנוסד ב-1838 באאי (Aÿ) (לפי התווית). זה הקווה הראשון שהבית מייצר בכל שנה.", "Chardonnay, pinot noir et pinot meunier": "שרדונה, פינו נואר ופינו מונייה", "Champagne (Aÿ)": "שמפאן (Aÿ)", "Brochure officielle Deutz": "החוברת הרשמית של Deutz", "Gonzalez Byass (importateur UK)": "Gonzalez Byass (יבואן בבריטניה)", "Méthode traditionnelle, comme le champagne : deuxième fermentation en bouteille.": "השיטה המסורתית, כמו בשמפניה: תסיסה שנייה בבקבוק.", "Alsace": "אלזס", "Pét-nat (pétillant naturel) : la bouteille est fermée avant la fin de la première fermentation, ce qui crée les bulles.": "Pét-nat (pétillant naturel, תוסס טבעי): סוגרים את הבקבוק לפני סוף התסיסה הראשונה, וכך נוצרות הבועות.", "Le dabouki est un cépage ancien, originaire de la région (carte de Trigger).": "דבוקי הוא זן עתיק, שמקורו באזור (התפריט של Trigger).", "100 % Dabouki": "100% דבוקי", "Binyamina": "בנימינה", "Un chardonnay de Bourgogne frais, élégant et minéral.": "שרדונה מבורגון, רענן, אלגנטי ומינרלי.", "Vendanges à la main, tri à la vigne. Pressurage doux, puis fermentations dans des fûts de chêne français de 500 litres, avec les levures naturelles du raisin.": "בציר ידני, מיון בכרם. סחיטה עדינה, ואחר כך תסיסה בחביות אלון צרפתי של 500 ליטר, עם השמרים הטבעיים של הענבים.", "10 mois sur lies fines, en grands fûts de 500 litres sans fût neuf, sans bâtonnage. Le bois reste discret.": "10 חודשים על שמרים עדינים, בחביות גדולות של 500 ליטר בלי חבית חדשה, בלי Bâtonnage (ערבוב השמרים ביין). העץ נשאר עדין.", "Vignes d'environ 35 ans, sur des sols argilo-calcaires de la Côte de Beaune.": "גפנים בנות כ-35 שנה, על קרקע של חימר וגיר ב-Côte de Beaune.", "12 °C": "12 מעלות", "100 % Chardonnay": "100% שרדונה", "Bourgogne (Côte d'Or)": "בורגון (Côte d'Or)", "minéral": "מינרלי", "Site officiel Vincent Girardin": "האתר הרשמי של Vincent Girardin", "Vendanges à la main, vignes cultivées en bio. Fermentation avec les levures naturelles du raisin.": "בציר ידני, גפנים בגידול אורגני. תסיסה עם השמרים הטבעיים של הענבים.", "Environ 14 à 20 mois sur lies fines, entièrement en cuve inox (pas de fût).": "כ-14 עד 20 חודשים על שמרים עדינים, כולו במיכל נירוסטה (בלי חבית).", "Vignes de 20 à 30 ans, surtout à Préhy et Courgis, au sud de Chablis.": "גפנים בנות 20 עד 30 שנה, בעיקר בפרייה (Préhy) ובקורז'י (Courgis), דרומית לשאבלי.", "Le domaine est connu pour ses élevages particulièrement longs. Il est tenu par Virginie Moreau depuis le décès de son mari Stéphane, en 2016.": "היקב ידוע ביישון ארוך במיוחד. מנהלת אותו וירז'יני מורו מאז מות בעלה סטפן ב-2016.", "Chardonnay (cépage de l'appellation Chablis)": "שרדונה (הזן של שאבלי)", "Bourgogne (Chablis)": "בורגון (שאבלי)", "Grand Cru Selections (importateur USA)": "Grand Cru Selections (יבואן בארה\"ב)", "Bibendum (importateur Australie)": "Bibendum (יבואן באוסטרליה)", "Alliance Wine (importateur UK)": "Alliance Wine (יבואן בבריטניה)", "Carte de Trigger": "התפריט של Trigger", "Vinification en cuves, selon la tradition du vignoble.": "ייצור במיכלים, לפי המסורת של האזור.", "Toujours en cuves thermorégulées (pas de fût), sans rien ajouter qui changerait le caractère naturel du vin.": "תמיד במיכלים עם בקרת טמפרטורה (בלי חבית), בלי להוסיף שום דבר שישנה את האופי הטבעי של היין.", "Coteaux bien pentus sur la commune de Maligny, sol très pauvre et caillouteux : un des lieux-dits où le calcaire est le plus présent.": "מדרונות תלולים בכפר מאליני (Maligny), קרקע ענייה מאוד ומלאת אבנים: אחת החלקות שבהן הגיר הכי נוכח.", "L'Homme Mort est l'un des huit lieux-dits du Premier Cru Fourchaume, et sa meilleure partie. Avec plus de 17 hectares, Jean Durup en est le plus grand propriétaire. Le vin garde la rondeur de Fourchaume, avec beaucoup plus de minéralité.": "L'Homme Mort היא אחת משמונה ה-Lieux-dits (חלקות כרם בעלות שם היסטורי) של ה-Premier Cru Fourchaume, והחלק הטוב ביותר שלו. עם יותר מ-17 הקטאר, ז'אן דורופ הוא הבעלים הגדול ביותר בה. היין שומר על העגלגלות של Fourchaume, עם הרבה יותר מינרליות.", "Oui, il gagne à être passé en carafe.": "כן, כדאי להעביר אותו לקראף.", "Gagne à vieillir quelques années.": "משתבח עם כמה שנות יישון.", "Site officiel Jean Durup (durup-chablis.com)": "האתר הרשמי של Jean Durup (durup-chablis.com)", "Guide Hachette des Vins": "Guide Hachette des Vins (מדריך היינות של אשט)", "Élevé uniquement en cuve inox, sans fût.": "מיושן רק במיכל נירוסטה, בלי חבית.", "Une petite parcelle de vignes d'environ 25 ans.": "חלקה קטנה של גפנים בנות כ-25 שנה.", "Le 2023 n'est que le deuxième millésime de cette cuvée : Virginie Moreau a attendu que les jeunes vignes aient assez d'intensité pour en faire un Premier Cru à part.": "2023 הוא רק הבציר השני של הקווה הזה: וירז'יני מורו חיכתה שלגפנים הצעירות תהיה מספיק עוצמה כדי לעשות מהן Premier Cru נפרד.", "Lea & Sandeman (importateur UK)": "Lea & Sandeman (יבואן בבריטניה)", "Étiquette et contre-étiquette de la bouteille": "התווית והתווית האחורית של הבקבוק", "Fermentation en demi-muids (fûts de 600 litres) et en « cigares » (fûts allongés de 350 litres).": "תסיסה ב-Demi-muids (חביות של 600 ליטר) וב«סיגרים» (חביות מוארכות של 350 ליטר).", "Élevé sur lies fines dans ces mêmes fûts.": "מיושן על שמרים עדינים באותן חביות.", "Coteau de calcaire et de « griottes » (petits cailloux) à Chavignol, exposé plein sud. Vignes cultivées en bio.": "מדרון של גיר ושל «Griottes» (אבנים קטנות) בשביניול (Chavignol), פונה לדרום. גפנים בגידול אורגני.", "Les Bouffants est un des lieux-dits mythiques de Sancerre : le domaine l'a isolé pour montrer une autre facette de ses terroirs. Les vignes poussent sur les « caillottes », des cailloux de calcaire typiques du Sancerrois (contre-étiquette).": "Les Bouffants היא אחת החלקות המיתולוגיות של סנסר: היקב הפריד אותה כדי להראות צד אחר של ה-Terroirs (אזורי הגידול) שלו. הגפנים גדלות על ה-«Caillottes», אבני גיר טיפוסיות לאזור סנסר (התווית האחורית).", "100 % Sauvignon Blanc": "100% סוביניון בלאן", "Vallée de la Loire": "עמק הלואר", "13 %": "13%", "Comptoir des Millésimes (partenaire du domaine)": "Comptoir des Millésimes (שותף של היקב)", "Cream Wine (importateur USA)": "Cream Wine (יבואן בארה\"ב)", "Raisins égrappés puis macérés avec leurs peaux pendant deux semaines en cuve inox : c'est ce qui lui donne sa couleur et en fait un vin orange (style « ramato »).": "הענבים מופרדים מהעוקצים ומושרים עם הקליפות שבועיים במיכל נירוסטה: זה מה שנותן לו את הצבע והופך אותו ליין כתום (סגנון «Ramato»).", "Environ 11 mois en grands fûts de chêne français usagés (20 hectolitres).": "כ-11 חודשים בחביות גדולות של אלון צרפתי משומש (20 הקטוליטר).", "Goriška Brda est la région slovène collée au Collio italien : les mêmes collines, de chaque côté de la frontière.": "גוריסקה ברדה הוא האזור הסלובני שצמוד לקוליו (Collio) האיטלקי: אותן גבעות, משני צדי הגבול.", "Pinot Gris (Sivi Pinot en slovène, Pinot Grigio en italien)": "פינו גרי (Sivi Pinot בסלובנית, Pinot Grigio באיטלקית)", "Goriška Brda": "גוריסקה ברדה", "Field Blend Selections (importateur USA)": "Field Blend Selections (יבואן בארה\"ב)", "Castille-et-León": "קסטיליה ולאון", "Galice (O Rosal)": "גליסיה (O Rosal)", "Galilée": "גליל", "Ombrie": "אומבריה", "Vallée de la Loire (Pays nantais)": "עמק הלואר (אזור נאנט)", "100 % Melon de Bourgogne (cépage du Muscadet)": "100% מלון דה בורגון (הזן של Muscadet)", "100 % Tempranillo (appelé « Tinta del País » en Ribera del Duero)": "100% טמפרניו (נקרא „Tinta del País” ב-Ribera del Duero)", "Albariño 81 %, Loureiro 12 %, Treixadura 5 %, Caíño Blanco 2 %": "אלבריניו 81%, לורירו 12%, טרייששדורה 5%, קאיניו בלאנקו 2%", "Roussanne 50 %, Grenache blanc 20 %, Clairette 20 %, Bourboulenc 10 % (cuvée Tradition, selon la fiche du domaine)": "רוסאן 50%, גרנאש בלאן 20%, קלרט 20%, בורבולנק 10% (Cuvée (מהדורה) Tradition, לפי דף המידע של היקב)", "Sauvignon Blanc (cépage de l'appellation Sancerre blanc)": "סוביניון בלאן (הזן של Sancerre לבן)", "Surtout Grenache et Rolle (Vermentino), selon la fiche du domaine": "בעיקר גרנאש ורול (ורמנטינו), לפי דף המידע של היקב", "Surtout du Grechetto, avec Sauvignon Blanc, Vermentino et Procanico (proportions du 2022 : 50 / 20 / 20 / 10 %)": "בעיקר גרקטו, עם סוביניון בלאן, ורמנטינו ופרוקניקו (היחסים של בציר 2022: ‎50 / 20 / 20 / 10%)", "10 mois en fûts, à la manière de la Bourgogne, avec un bâtonnage deux fois par semaine.": "10 חודשים בחביות, בסגנון בורגונדי, עם Bâtonnage (ערבוב המשקעים בתוך החבית) פעמיים בשבוע.", "En cuves et en fûts de chêne. Selon la contre-étiquette : 6 mois en fûts de chêne, en partie neufs.": "במיכלים ובחביות עץ אלון. לפי התווית האחורית: 6 חודשים בחביות אלון, חלקן חדשות.", "Environ 24 mois sur lies fines, en cuve souterraine (fiche du millésime 2023).": "כ-24 חודשים על משקעי שמרים עדינים, במיכל תת-קרקעי (לפי דף המידע של בציר 2023).", "Le domaine compte 35 hectares, dont 26 de Sauvignon Blanc, surtout à Bué et dans les villages voisins.": "ליקב 35 הקטאר, מהם 26 של סוביניון בלאן, בעיקר ב-Bué ובכפרים הסמוכים.", "Les vignes de cépages blancs sont surtout plantées sur les sols calcaires du domaine, cultivés en bio (contre-étiquette).": "הגפנים של הזנים הלבנים נטועות בעיקר בקרקעות הגיריות של היקב, בגידול אורגני (התווית האחורית).", "Raisins venant uniquement des vignes du Château d'Esclans, à La Motte, dans le Var.": "ענבים רק מהכרמים של Château d'Esclans, ב-La Motte שבפרובאנס.", "Tout l'Albariño vient des parcelles du domaine dans la sous-zone d'O Rosal, au sud des Rías Baixas, face au Portugal.": "כל האלבריניו מגיע מחלקות של היקב בתת-האזור O Rosal, בדרום Rías Baixas, מול פורטוגל.", "Vieilles vignes sur granite, cultivées en bio.": "גפנים ותיקות על קרקע גרניט, בגידול אורגני.", "Rosé de méthode traditionnelle : le Grenache est vendangé à la main assez tôt pour garder une belle acidité, puis pressé doucement, ce qui donne sa couleur rose pâle.": "רוזה בשיטה מסורתית: הגרנאש נבצר ביד מוקדם יחסית כדי לשמור על חומציות יפה, ואז נסחט בעדינות, וכך מקבל את צבעו הוורוד החיוור.", "Rosé de saignée : on prélève du jus dans la cuve de vin rouge, puis il fermente avec les levures naturelles du raisin.": "רוזה בשיטת Saignée (הקזה): לוקחים מיץ ממיכל היין האדום, והוא תוסס עם השמרים הטבעיים של הענבים.", "Vendanges du lever du soleil jusqu'à midi, raisins triés trois fois. Égrappage, légère pression au froid (7-8 °C), sans macération. Fermentation en demi-muids (fûts de 600 litres) neufs et d'un an.": "בציר מהזריחה ועד הצהריים, והענבים ממוינים שלוש פעמים. הפרדת העוקצים, סחיטה עדינה בקור (7-8 מעלות), בלי השריה. תסיסה ב-Demi-muids (חביות של 600 ליטר) חדשות ובנות שנה.", "Vendanges à la main. Pressurage doux en grappes entières, débourbage léger à froid, fermentation avec les levures naturelles du raisin.": "בציר ידני. סחיטה עדינה של אשכולות שלמים, Débourbage (שיקוע המיץ להפרדת המשקעים) קל בקור, ותסיסה עם השמרים הטבעיים של הענבים.", "Bat Shlomo est installé le long de l'historique « route des vins Rothschild ». Un rosé sec et vif, avec des notes florales délicates et d'agrumes, et une finale fraîche (contre-étiquette). Vin casher.": "בת שלמה נמצא לאורך „דרך היין של רוטשילד” ההיסטורית. רוזה יבש ורענן, עם ניחוחות פרחוניים עדינים והדרים, וסיומת רעננה (התווית האחורית). יין כשר.", "Château d'Esclans est le domaine qui fait aussi le célèbre Whispering Angel. Les Clans est un rosé de gastronomie, élevé en fûts comme un grand vin blanc.": "Château d'Esclans הוא היקב שמייצר גם את Whispering Angel המפורסם. Les Clans הוא רוזה לארוחה, שמיושן בחביות כמו יין לבן גדול.", "Clisson est un des « crus communaux » du Muscadet : ces vins doivent rester beaucoup plus longtemps sur leurs lies, ce qui leur donne plus de richesse.": "Clisson הוא אחד מה-Crus (כרמים מסווגים) של הכפרים ב-Muscadet: היינות האלה חייבים להישאר הרבה יותר זמן על משקעי השמרים, וזה נותן להם יותר עושר.", "Decugnano dei Barbi est un domaine de référence d'Orvieto, en Ombrie.": "Decugnano dei Barbi הוא יקב מוביל באזור Orvieto שבאומבריה.", "Domaine de la famille Brunel, vignerons depuis 1670 (étiquette). On reconnaît le château de loin grâce à sa tour de 22 mètres. Arômes d'agrumes, de thym, de réglisse et de fenouil (contre-étiquette).": "היקב של משפחת Brunel, כורמים מאז 1670 (התווית). מזהים את הטירה מרחוק בזכות המגדל שלה בגובה 22 מטר. ניחוחות של הדרים, טימין, ליקריץ ושומר (התווית האחורית).", "Lagar de Fornelos appartient à La Rioja Alta. Dans la tradition d'O Rosal, on assemble l'Albariño avec d'autres cépages blancs de Galice. La contre-étiquette israélienne indique seulement « Albariño ».": "Lagar de Fornelos שייך ל-La Rioja Alta. במסורת של O Rosal עושים בלנד של אלבריניו עם זנים לבנים אחרים מגליסיה. התווית האחורית הישראלית מציינת רק „אלבריניו”.", "Le domaine est né de l'union de deux familles de vignerons de Bué. Lucien Picard, l'un des grands-pères, a été dans les années 1950 l'un des premiers à mettre le Sancerre en bouteille pour le vendre à Paris.": "היקב נולד מאיחוד של שתי משפחות כורמים מ-Bué. Lucien Picard, אחד הסבים, היה בשנות ה-50 מהראשונים שביקבקו Sancerre כדי למכור אותו בפריז.", "Viña Sastre est une bodega familiale de La Horra, en Ribera del Duero. La contre-étiquette indique « vin rosé sec ».": "Viña Sastre הוא יקב משפחתי ב-La Horra שב-Ribera del Duero. על התווית האחורית כתוב „יין רוזה יבש”.", "Contre-étiquette de la bouteille (domaine)": "התווית האחורית של הבקבוק (היקב)", "Falstaff (guide)": "Falstaff (מדריך יין)", "Fiche technique officielle Château d'Esclans": "דף מידע טכני רשמי של Château d'Esclans", "Fiche technique officielle Château de la Gardine": "דף מידע טכני רשמי של Château de la Gardine", "Gambero Rosso": "Gambero Rosso (מדריך יין איטלקי)", "James Suckling (critique), cité par l'importateur": "James Suckling (מבקר יין), מצוטט על ידי היבואן", "Site officiel La Rioja Alta – Pazo de Seoane Rosal": "האתר הרשמי של La Rioja Alta – Pazo de Seoane Rosal", "Site officiel – Les Clans": "האתר הרשמי – Les Clans", "Skurnik (importateur USA)": "Skurnik (יבואן בארה״ב)", "Spanish Wine Lover (guide, Amaya Cervera)": "Spanish Wine Lover (מדריך יין, Amaya Cervera)", "Wine Spectator": "Wine Spectator (מגזין יין)", "Grenache 90 %, Syrah 10 % (contre-étiquette du 2022)": "גרנאש 90%, סירה 10% (התווית האחורית של בציר 2022)", "Environ 14 mois en fûts de chêne (contre-étiquette).": "כ-14 חודשים בחביות עץ אלון (התווית האחורית).", "Peut vieillir en bouteille (contre-étiquette). Plus de dix ans selon la maison (profil 2023).": "יכול להתיישן בבקבוק (התווית האחורית). יותר מעשר שנים לפי היקב (פרופיל 2023).", "Contre-étiquette de la bouteille": "התווית האחורית של הבקבוק", "Surtout du Cabernet Sauvignon (contre-étiquette)": "בעיקר קברנה סוביניון (התווית האחורית)", "Parcelles choisies dans le vignoble de Château Golan, au sud du plateau du Golan, à 400 mètres d'altitude, sur un sol profond de basalte vieux d'environ cinq millions d'années.": "חלקות נבחרות בכרם של שאטו גולן בדרום רמת הגולן, בגובה 400 מטר, על אדמת בזלת עמוקה בת כחמישה מיליון שנים.", "Le vin porte le nom du village (moshav) où se trouve le domaine, Eli-Ad. Chaque année, il cherche à montrer la plus belle expression du Cabernet Sauvignon de ce millésime. Vin non casher.": "היין נושא את שם המושב שבו נמצא היקב, אליעד. בכל בציר הוא מנסה ללכוד את הביטוי הייחודי והיפה ביותר של הקברנה סוביניון. יין לא כשר.", "Monts de Judée (vallée d'Ayalon)": "הרי יהודה (עמק איילון)", "100 % Syrah": "100% סירה", "Vendanges à la main. Égrappage, foulage doux, puis fermentation et macération en cuves fermées et ouvertes, avec les levures naturelles du raisin.": "בציר ידני. הפרדת העוקצים ומעיכה עדינה, ואז תסיסה והשריה במיכלים סגורים ופתוחים, עם שמרי הבר הטבעיים של הענבים.", "20 mois en fûts neufs de chêne français, dans la cave du domaine. Vin non filtré.": "20 חודשים בחביות חדשות של עץ אלון צרפתי, במרתף היקב. יין לא מסונן.", "Vignobles Harel, vallée d'Ayalon, Monts de Judée.": "כרמי הראל, עמק איילון, הרי יהודה.", "La série Sycra n'est faite qu'une fois tous les quelques ans, seulement lors d'un millésime exceptionnel. Vin vegan, non casher.": "סדרת סיקרא מיוצרת רק פעם בכמה שנים, בבציר מיוחד בלבד. יין טבעוני, לא כשר.", "Site du domaine": "האתר של היקב", "« Crianza » en Ribera del Duero : le vin doit vieillir au moins deux ans avant d'être vendu, dont au moins un an en fût de chêne. Même bodega familiale que le rosé Marcelina Gómez.": "„Crianza” ב-Ribera del Duero: היין חייב להתיישן לפחות שנתיים לפני שהוא נמכר, מתוכן לפחות שנה בחבית עץ אלון. אותו יקב משפחתי של הרוזה Marcelina Gómez.", "Sélection massale de Sciaccarello greffée sur des vignes d'une trentaine d'années, sur une parcelle peu profonde de molasse posée sur un banc calcaire.": "ייחורים של סקיאקרלו שהורכבו על גפנים בנות כשלושים שנה, בחלקה רדודה של Molasse (סלע חולי רך) על שכבת גיר.", "Contre-filet de veau (conseil de la contre-étiquette)": "סינטה עגל (המלצת התווית האחורית)", "Le Sciaccarello est un cépage corse : le domaine l'a importé sur le continent, près de Miramas. Vin de France, certifié bio et biodynamie (Demeter). Non casher.": "סקיאקרלו הוא זן מקורסיקה: היקב הביא אותו ליבשת, ליד Miramas. Vin de France (יין צרפתי ללא אפלסיון), עם הסמכה אורגנית וביודינמית (Demeter). לא כשר.", "Tempranillo (Tinta Fina) · Crianza (contre-étiquette)": "טמפרניו (טינטה פינה) · Crianza (התווית האחורית)", "Raisins des meilleures parcelles du domaine, vendangés à la main.": "ענבים מהחלקות הטובות ביותר של היקב, בבציר ידני.", "18 mois en fûts de chêne français (contre-étiquette du 2023). Pour les millésimes précédents, le domaine indiquait environ 16 mois en barriques surtout neuves, puis environ 4 mois en cuves béton.": "18 חודשים בחביות עץ אלון צרפתי (התווית האחורית של 2023). בבצירים הקודמים היקב ציין כ-16 חודשים בחביות, רובן חדשות, ואחר כך כ-4 חודשים במיכלי בטון.", "C'est le tout premier vin du domaine, avec le Grand Vin 1992. La première vigne avait été plantée en 1988 dans le jardin familial, à Ramat Raziel. Vin casher (aussi pour Pessah), vegan.": "זה היין הראשון של היקב, עם ה-Grand Vin של 1992. הגפן הראשונה ניטעה ב-1988 בגינה של המשפחה ברמת רזיאל. יין כשר (גם לפסח), טבעוני.", "Pinot Noir": "פינו נואר", "Bourgogne": "בורגונדי", "Vinifié, élevé et mis en bouteille par Vincent Girardin à Meursault, en Côte d'Or (contre-étiquette).": "התסיסה, היישון והביקבוק נעשו אצל Vincent Girardin ב-Meursault שבקוט ד'אור (התווית האחורית).", "C'est le pendant en rouge du Bourgogne Chardonnay Cuvée Saint-Vincent, que nous avons aussi à Trigger.": "זו הגרסה האדומה של ה-Bourgogne Chardonnay Cuvée Saint-Vincent, שיש לנו גם בטריגר.", "Abruzzes": "אברוצו", "Montepulciano (cépage de l'appellation)": "מונטפולצ'יאנו (הזן של האפלסיון)", "Cantina Zaccagnini est à Bolognano, dans la province de Pescara. L'étiquette rappelle que ce « vin du Tralcetto » existe depuis 1978. Attention : le Montepulciano d'Abruzzo est fait avec le cépage Montepulciano, rien à voir avec le Vino Nobile di Montepulciano de Toscane.": "Cantina Zaccagnini נמצא ב-Bolognano, במחוז פסקרה. התווית מזכירה ש„יין ה-Tralcetto” קיים מאז 1978. שימו לב: Montepulciano d'Abruzzo עשוי מהזן מונטפולצ'יאנו, ואין לו קשר ל-Vino Nobile di Montepulciano מטוסקנה.", "Travail soigné à la vigne et vendanges à la main.": "טיפול מוקפד בכרם ובציר ידני.", "En fûts de bois, pour donner équilibre et complexité tout en gardant le caractère de la région et du cépage.": "בחביות עץ, כדי לתת איזון ומורכבות תוך שמירה על האופי של האזור ושל הזן.", "Vignoble de Château Golan, au sud du plateau du Golan, à 400 mètres d'altitude, sur un sol profond de basalte vieux d'environ cinq millions d'années.": "הכרם של שאטו גולן בדרום רמת הגולן, בגובה 400 מטר, על אדמת בזלת עמוקה בת כחמישה מיליון שנים.", "Même domaine que l'Eliad, à Eli-Ad. Vin non casher.": "אותו יקב של האליעד, באליעד. יין לא כשר.", "Syrah, Cabernet Sauvignon, Mourvèdre (proportions non indiquées)": "סירה, קברנה סוביניון, מורבדר (היחסים לא מצוינים)", "Vignobles Harel, vallée d'Ayalon, Monts de Judée. Raisins du domaine, vinifiés et mis en bouteille sur place.": "כרמי הראל, עמק איילון, הרי יהודה. ענבים של היקב, שהיין מהם נעשה ובוקבק במקום.", "Même domaine que le Sycra. Vin vegan, non casher.": "אותו יקב של הסיקרא. יין טבעוני, לא כשר."};
